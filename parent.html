<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة ولي الأمر | Jebali Math Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function ParentPortal() {
            const [phoneInput, setPhoneInput] = useState('');
            const [password, setPassword] = useState('');
            const [studentData, setStudentData] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            async function handleLogin(e) {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                let cleanPhone = phoneInput.replace(/\D/g, '');

                // البحث إما برقم ولي الأمر أو رقم الطالب
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .or(`parent_phone.ilike.%${cleanPhone}%,student_phone.ilike.%${cleanPhone}%`)
                    .single();

                if (error || !data) {
                    setErrorMsg('رقم الهاتف المدخل غير مسجل في النظام.');
                    setLoading(false);
                    return;
                }

                // التحقق من كلمة المرور
                if (data.password && data.password !== password) {
                    setErrorMsg('كلمة المرور غير صحيحة!');
                    setLoading(false);
                    return;
                }

                setStudentData(data);
                fetchParentData(data.id);
                setLoading(false);
            }

            async function fetchParentData(studentId) {
                const { data: sessData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', studentId)
                    .order('created_at', { ascending: false });
                if (sessData) setSessions(sessData);
            }

            if (!studentData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir="rtl">
                        <div className="absolute top-6 left-6">
                            <a href="index.html" className="px-5 py-2 glass-card rounded-full font-bold text-xs hover:bg-white/20 transition flex items-center gap-2">
                                <span>🏠</span> الرئيسية
                            </a>
                        </div>

                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
                            <div className="text-6xl mb-4">👨‍👩‍👦</div>
                            <h2 className="text-3xl font-black mb-2">بوابة ولي الأمر</h2>
                            <p className="text-blue-200 text-xs mb-6">أدخل رقم هاتف ولي الأمر أو الطالب مع كلمة المرور</p>
                            
                            {errorMsg && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 text-xs font-bold">{errorMsg}</p>}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <input 
                                    type="tel" 
                                    placeholder="رقم الهاتف (ولي الأمر أو الطالب)" 
                                    required 
                                    className="w-full p-4 glass-input rounded-xl font-bold text-center" 
                                    value={phoneInput} 
                                    onChange={e => setPhoneInput(e.target.value)} 
                                />
                                <input 
                                    type="password" 
                                    placeholder="كلمة المرور" 
                                    required 
                                    className="w-full p-4 glass-input rounded-xl font-bold text-center" 
                                    value={password} 
                                    onChange={e => setPassword(e.target.value)} 
                                />
                                <button type="submit" disabled={loading} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl transition shadow-lg text-sm">
                                    {loading ? 'جاري التحقق...' : 'دخول بوابة ولي الأمر'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            const totalUnpaid = sessions.filter(s => !s.is_paid).reduce((sum, s) => sum + (s.calculated_cost || 0), 0);

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto font-cairo" dir="rtl">
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div>
                            <h1 className="text-xl md:text-2xl font-black">متابعة ولي الأمر • {studentData.student_name} 📐</h1>
                            <p className="text-blue-200 text-xs mt-1">{studentData.curriculum_system} • {studentData.grade_level}</p>
                        </div>
                        <div className="flex gap-2">
                            <a href="index.html" className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs transition flex items-center gap-1">
                                🏠 الرئيسية
                            </a>
                            <button onClick={() => setStudentData(null)} className="px-4 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-xs transition">
                                خروج
                            </button>
                        </div>
                    </header>

                    {/* الملخص المالي */}
                    <div className="glass-card p-6 rounded-3xl mb-8 border-t-4 border-orange-500">
                        <span className="text-xs font-bold text-orange-200 bg-orange-500/20 px-3 py-1 rounded-full">المستحقات المالية المعلقة</span>
                        <h3 className="text-3xl font-black mt-3 text-white">{totalUnpaid} <span className="text-lg text-blue-200">EGP</span></h3>
                        <p className="text-xs text-blue-200 mt-2">يمكنكم السداد بسهولة عبر InstaPay أو المحافظ الإلكترونية الخاصة بالأستاذ.</p>
                    </div>

                    {/* سجل حصص المتابعة */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-lg font-black mb-4 flex items-center gap-2">
                            <span>📋</span> سجل الحصص والمصاريف
                        </h3>
                        {sessions.length === 0 ? (
                            <p className="text-xs text-slate-300 text-center py-6">لا توجد حصص مسجلة للطالب بعد.</p>
                        ) : (
                            <div className="space-y-3">
                                {sessions.map(s => (
                                    <div key={s.id} className="p-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                        <div>
                                            <div className="font-black text-sm text-white">{s.lesson_topic}</div>
                                            <div className="text-xs text-blue-300 mt-1 font-semibold">{s.strand} {s.skills_covered ? `• ${s.skills_covered}` : ''}</div>
                                        </div>
                                        <div className="flex items-center gap-4">
                                            <span className="text-xs font-black text-orange-300">{s.calculated_cost} EGP</span>
                                            <span className={`text-xs px-3 py-1 rounded-full font-bold ${s.is_paid ? 'bg-emerald-500/20 text-emerald-300' : 'bg-orange-500/20 text-orange-300'}`}>
                                                {s.is_paid ? '✅ مسددة' : '⏳ معلقة'}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ParentPortal />);
    </script>
</body>
</html>
