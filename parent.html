<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }

        @media print {
            body { background: white !important; color: black !important; }
            .no-print { display: none !important; }
            .glass-card { background: white !important; border: 1px solid #ccc !important; box-shadow: none !important; color: black !important; }
            .print-text-dark { color: #111 !important; }
            table { border-collapse: collapse; width: 100%; color: black !important; }
            th, td { border: 1px solid #ddd !important; padding: 8px !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function ParentPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [phone, setPhone] = useState('');
            const [myKids, setMyKids] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [submissions, setSubmissions] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            const handleSearchByPhone = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setErrorMessage('');

                const cleanPhone = phone.trim();
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .or(`parent_phone.eq.${cleanPhone},student_phone.eq.${cleanPhone}`);

                setIsLoading(false);

                if (error) {
                    setErrorMessage(isArabic ? 'حدث خطأ في الاتصال بالخادم.' : 'Server connection error.');
                    return;
                }

                if (!data || data.length === 0) {
                    setErrorMessage(isArabic ? 'عفواً، لا يوجد حساب مسجل بهذا الرقم.' : 'No records found matching this phone number.');
                    return;
                }

                setMyKids(data);

                if (data.length === 1) {
                    loadStudentData(data[0]);
                }
            };

            const loadStudentData = async (student) => {
                setIsLoading(true);
                setSelectedStudent(student);

                const { data: sessionData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', student.id)
                    .order('created_at', { ascending: false });
                setSessions(sessionData || []);

                const { data: submissionData } = await supabase
                    .from('homework_submissions')
                    .select('*')
                    .eq('student_id', student.id)
                    .order('created_at', { ascending: false });
                setSubmissions(submissionData || []);

                setIsLoading(false);
            };

            const totalDue = sessions.filter(s => !s.is_paid).reduce((sum, s) => sum + (s.calculated_cost || 0), 0);
            const totalHours = sessions.reduce((sum, s) => sum + (s.duration_hours || 0), 0);

            const gradedSubmissions = submissions.filter(s => s.score != null);
            const averageScore = gradedSubmissions.length > 0 
                ? (gradedSubmissions.reduce((sum, s) => sum + parseFloat(s.score), 0) / gradedSubmissions.length).toFixed(1)
                : null;

            if (!selectedStudent && myKids.length <= 1) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <div className="absolute top-6 left-6 right-6 flex justify-between no-print">
                            <a href="/" className="px-5 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-6 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                        </div>
                        
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
                            <div className="text-6xl mb-6">👨‍👩‍👦</div>
                            <h2 className="text-3xl font-black mb-2">{isArabic ? 'بوابة أولياء الأمور' : 'Parent Portal'}</h2>
                            <p className="text-blue-200 font-bold text-sm mb-6">{isArabic ? 'أدخل رقم هاتفك أو رقم هاتف الطالب للدخول' : 'Enter parent or student phone to view reports'}</p>
                            
                            {errorMessage && (
                                <p className="bg-red-500/20 border border-red-500/50 text-red-100 p-3 rounded-xl mb-4 text-sm font-bold">
                                    {errorMessage}
                                </p>
                            )}

                            <form onSubmit={handleSearchByPhone} className="space-y-4">
                                <input 
                                    type="tel" 
                                    required 
                                    placeholder={isArabic ? 'رقم الهاتف المسجل' : 'Registered phone number'} 
                                    value={phone} 
                                    onChange={(e) => setPhone(e.target.value)} 
                                    className="w-full p-4 glass-input rounded-xl font-bold text-center text-lg outline-none focus:border-emerald-400"
                                />
                                <button type="submit" disabled={isLoading || !phone} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl transition shadow-lg shadow-emerald-600/30 disabled:opacity-50">
                                    {isLoading ? '...' : (isArabic ? 'دخول ومتابعة' : 'Access Dashboard')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (!selectedStudent && myKids.length > 1) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
                            <div className="text-5xl mb-4">👥</div>
                            <h2 className="text-2xl font-black mb-2">{isArabic ? 'اختر الطالب للمتابعة' : 'Select Student'}</h2>
                            <p className="text-blue-200 font-bold text-sm mb-6">{isArabic ? 'تم العثور على أكثر من حساب مسجل' : 'Multiple students linked to this phone'}</p>
                            
                            <div className="space-y-3">
                                {myKids.map(kid => (
                                    <button 
                                        key={kid.id} 
                                        onClick={() => loadStudentData(kid)}
                                        className="w-full p-4 glass-card hover:bg-white/20 rounded-xl font-bold flex justify-between items-center transition border border-white/20">
                                        <span>{kid.student_name}</span>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">{kid.grade_level}</span>
                                    </button>
                                ))}
                            </div>
                            <button onClick={() => { setMyKids([]); setSelectedStudent(null); }} className="mt-6 text-sm text-blue-300 underline">
                                {isArabic ? 'استخدام رقم آخر' : 'Use different phone'}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`p-4 md:p-8 max-w-6xl mx-auto ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 gap-4 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-emerald-600/50">📊</div>
                            <div>
                                <h1 className="text-2xl font-black text-white print-text-dark">{isArabic ? `تقرير متابعة: ${selectedStudent.student_name}` : `Report: ${selectedStudent.student_name}`}</h1>
                                <p className="text-blue-200 font-bold text-sm print-text-dark">{selectedStudent.curriculum_system} • {selectedStudent.grade_level}</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-3 no-print">
                            <button onClick={() => window.print()} className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-lg">
                                <span>🖨️</span> {isArabic ? 'طباعة / حفظ PDF' : 'Print / PDF'}
                            </button>
                            <a href="/" className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                            <button onClick={() => { setSelectedStudent(null); setMyKids([]); }} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-sm border border-red-500/50 transition">
                                {isArabic ? 'خروج' : 'Logout'}
                            </button>
                        </div>
                    </header>

                    {/* الإحصائيات العامة */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="glass-card p-6 rounded-3xl border-t-4 border-orange-500">
                            <span className="text-xs font-bold text-orange-200 bg-orange-500/20 px-3 py-1 rounded-full print-text-dark">{isArabic ? 'المستحقات المعلقة' : 'Pending Dues'}</span>
                            <h3 className="text-3xl font-black mt-4 text-white print-text-dark">{totalDue} <span className="text-lg text-blue-200 print-text-dark">EGP</span></h3>
                            <a href="https://ipn.eg" target="_blank" className="block text-center py-2.5 mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition text-xs no-print">
                                {isArabic ? 'سداد عبر InstaPay' : 'Pay via InstaPay'}
                            </a>
                        </div>

                        <div className="glass-card p-6 rounded-3xl border-t-4 border-indigo-500">
                            <span className="text-xs font-bold text-indigo-200 bg-indigo-500/20 px-3 py-1 rounded-full print-text-dark">{isArabic ? 'المعدل الأكاديمي' : 'Average Score'}</span>
                            <h3 className="text-3xl font-black mt-4 text-white print-text-dark">
                                {averageScore ? `${averageScore} ` : '-- '}
                                <span className="text-lg text-indigo-300 print-text-dark">/ 10</span>
                            </h3>
                            <p className="text-xs text-blue-200 mt-2 font-bold print-text-dark">{isArabic ? `تقييم ${submissions.length} واجب` : `Based on ${submissions.length} tasks`}</p>
                        </div>

                        <div className="glass-card p-6 rounded-3xl border-t-4 border-blue-500">
                            <span className="text-xs font-bold text-blue-200 bg-blue-500/20 px-3 py-1 rounded-full print-text-dark">{isArabic ? 'إجمالي الساعات والحصص' : 'Total Sessions & Hours'}</span>
                            <h3 className="text-3xl font-black mt-4 text-white print-text-dark">{sessions.length} <span className="text-lg text-blue-200 print-text-dark">({totalHours} {isArabic ? 'ساعة' : 'Hrs'})</span></h3>
                            <p className="text-xs text-blue-200 mt-2 font-bold print-text-dark">{isArabic ? 'حضور منتظم ومستمر' : 'Active attendance'}</p>
                        </div>
                    </div>

                    {/* تفاصيل الحصص الأكاديمية والمحاسبة */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-xl font-black mb-6 text-white print-text-dark">{isArabic ? '🗓️️ سجل الحصص والمحتوى الأكاديمي المشروح' : '🗓️ Academic Sessions Log & Content'}</h3>
                        {sessions.length === 0 ? (
                            <p className="text-blue-200 text-center py-8 font-bold print-text-dark">{isArabic ? 'لا توجد حصص مسجلة حتى الآن.' : 'No sessions logged yet.'}</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-right" dir={isArabic ? 'rtl' : 'ltr'}>
                                    <thead>
                                        <tr className="border-b border-white/10 text-blue-200 text-sm">
                                            <th className="pb-3 px-4">{isArabic ? 'التاريخ' : 'Date'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'الدرس والفرع الأكاديمي' : 'Topic & Strand'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'المهارات المغطاة' : 'Skills Covered'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'المدة' : 'Duration'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'التكلفة' : 'Cost'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'حالة السداد' : 'Payment'}</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5 font-bold">
                                        {sessions.map((session) => (
                                            <tr key={session.id} className="hover:bg-white/5 transition">
                                                <td className="py-4 px-4 text-sm">{new Date(session.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US')}</td>
                                                <td className="py-4 px-4">
                                                    <div className="text-white font-black print-text-dark">{session.lesson_topic || 'حصة عامة'}</div>
                                                    <div className="text-xs text-blue-300 print-text-dark">{session.strand || 'General'}</div>
                                                </td>
                                                <td className="py-4 px-4 text-xs text-slate-200 print-text-dark">
                                                    {session.skills_covered || '-'}
                                                </td>
                                                <td className="py-4 px-4">{session.duration_hours} {isArabic ? 'ساعة' : 'hrs'}</td>
                                                <td className="py-4 px-4 text-orange-300 print-text-dark">{session.calculated_cost} EGP</td>
                                                <td className="py-4 px-4">
                                                    {session.is_paid ? (
                                                        <span className="px-3 py-1 rounded-full text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                                                            {isArabic ? '✅ تم السداد' : '✅ Paid'}
                                                        </span>
                                                    ) : (
                                                        <span className="px-3 py-1 rounded-full text-xs bg-orange-500/20 text-orange-200 border border-orange-500/30">
                                                            {isArabic ? '⏳ معلق' : '⏳ Unpaid'}
                                                        </span>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>

                    {/* تقرير الواجبات الأكاديمي */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl">
                        <div className="flex items-center justify-between mb-6">
                            <div>
                                <h3 className="text-xl font-black text-white print-text-dark">{isArabic ? '📝 تقارير الواجبات والدرجات المعتمدة' : '📝 Graded Homework Reports'}</h3>
                                <p className="text-blue-200 text-xs font-bold mt-1 print-text-dark">{isArabic ? 'تفاصيل كل واجب مع موضوع المسألة والدرجة المحتسبة من 10 ونقاط التوجيه' : 'Tasks with topic, score out of 10, and remarks'}</p>
                            </div>
                            <span className="text-2xl no-print">🤖</span>
                        </div>

                        {submissions.length === 0 ? (
                            <p className="text-blue-200 text-center py-6 font-bold text-sm print-text-dark">{isArabic ? 'لم يقم الطالب برفع أي واجبات حتى الآن.' : 'No homework submitted yet.'}</p>
                        ) : (
                            <div className="space-y-4">
                                {submissions.map((sub, idx) => (
                                    <div key={sub.id} className="p-5 bg-white/5 border border-white/10 rounded-2xl">
                                        <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                            <div className="flex items-center gap-3">
                                                <span className="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full font-bold">
                                                    {sub.topic || (isArabic ? `واجب #${submissions.length - idx}` : `Task #${submissions.length - idx}`)}
                                                </span>
                                                {sub.score != null && (
                                                    <span className="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full font-black">
                                                        🎯 {sub.score} / 10
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-xs text-blue-200 font-bold">
                                                {new Date(sub.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' })}
                                            </span>
                                        </div>
                                        <p className="text-sm text-slate-100 whitespace-pre-wrap font-bold leading-relaxed">{sub.ai_feedback}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ParentPortal />);
    </script>
</body>
</html>
