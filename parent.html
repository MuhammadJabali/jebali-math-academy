<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة أولياء الأمور | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function ParentPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [phone, setPhone] = useState('');
            const [myKids, setMyKids] = useState([]);
            const [selectedStudent, setSelectedStudent] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [isLoading, setIsLoading] = useState(false);
            const [errorMessage, setErrorMessage] = useState('');

            // البحث عن الأبناء برقم الهاتف فقط
            const handleSearchByPhone = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setErrorMessage('');

                const cleanPhone = phone.trim();
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('parent_phone', cleanPhone);

                setIsLoading(false);

                if (error) {
                    setErrorMessage(isArabic ? 'حدث خطأ في الاتصال بالخادم.' : 'Server connection error.');
                    return;
                }

                if (!data || data.length === 0) {
                    setErrorMessage(isArabic ? 'عفواً، لا يوجد طلاب مسجلون بهذا الرقم.' : 'No students found with this phone number.');
                    return;
                }

                setMyKids(data);

                // إذا كان لديه ابن واحد فقط، نفتحه مباشرة
                if (data.length === 1) {
                    loadStudentData(data[0]);
                }
            };

            // جلب حصص الطالب المختار
            const loadStudentData = async (student) => {
                setIsLoading(true);
                setSelectedStudent(student);

                const { data: sessionData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', student.id)
                    .order('created_at', { ascending: false });

                setSessions(sessionData || []);
                setIsLoading(false);
            };

            const totalDue = sessions.reduce((sum, s) => sum + (s.calculated_cost || 0), 0);
            const totalHours = sessions.reduce((sum, s) => sum + (s.duration_hours || 0), 0);

            // 1. شاشة الدخول برقم الهاتف
            if (!selectedStudent && myKids.length <= 1) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <button onClick={() => setIsArabic(!isArabic)} className="absolute top-6 left-6 px-6 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition">
                            {isArabic ? 'English' : 'العربية'}
                        </button>
                        
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
                            <div className="text-6xl mb-6">👨‍👩‍👦</div>
                            <h2 className="text-3xl font-black mb-2">{isArabic ? 'بوابة أولياء الأمور' : 'Parent Portal'}</h2>
                            <p className="text-blue-200 font-bold text-sm mb-6">{isArabic ? 'أدخل رقم الهاتف المسجل لمتابعة حساب أبنائك' : 'Enter registered phone number to view reports'}</p>
                            
                            {errorMessage && (
                                <p className="bg-red-500/20 border border-red-500/50 text-red-100 p-3 rounded-xl mb-4 text-sm font-bold">
                                    {errorMessage}
                                </p>
                            )}

                            <form onSubmit={handleSearchByPhone} className="space-y-4">
                                <input 
                                    type="tel" 
                                    required 
                                    placeholder={isArabic ? 'مثال: 01012345678' : 'e.g. 01012345678'} 
                                    value={phone} 
                                    onChange={(e) => setPhone(e.target.value)} 
                                    className="w-full p-4 glass-input rounded-xl font-bold text-center text-lg outline-none focus:border-emerald-400"
                                />
                                <button type="submit" disabled={isLoading || !phone} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl transition shadow-lg shadow-emerald-600/30 disabled:opacity-50">
                                    {isLoading ? '...' : (isArabic ? 'دخول ومتابعة' : 'Access Dashboard')}
                                </button>
                            </form>
                            <div className="mt-6">
                                <a href="/" className="text-sm text-blue-300 hover:text-white underline decoration-blue-300 underline-offset-4">{isArabic ? 'العودة للصفحة الرئيسية' : 'Back to Home'}</a>
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. شاشة اختيار الابن (في حال كان لديه أكثر من طالب مسجل بنفس الرقم)
            if (!selectedStudent && myKids.length > 1) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
                            <div className="text-5xl mb-4">👥</div>
                            <h2 className="text-2xl font-black mb-2">{isArabic ? 'اختر الطالب للمتابعة' : 'Select Student'}</h2>
                            <p className="text-blue-200 font-bold text-sm mb-6">{isArabic ? 'تم العثور على أكثر من حساب مسجل برقمك' : 'Multiple students linked to your phone'}</p>
                            
                            <div className="space-y-3">
                                {myKids.map(kid => (
                                    <button 
                                        key={kid.id} 
                                        onClick={() => loadStudentData(kid)}
                                        className="w-full p-4 glass-card hover:bg-white/20 rounded-xl font-bold flex justify-between items-center transition border border-white/20">
                                        <span>{kid.student_name}</span>
                                        <span className="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full">{kid.grade_level}</span>
                                    </button>
                                ))}
                            </div>
                            <button onClick={() => { setMyKids([]); setSelectedStudent(null); }} className="mt-6 text-sm text-blue-300 underline">
                                {isArabic ? 'استخدام رقم آخر' : 'Use different phone'}
                            </button>
                        </div>
                    </div>
                );
            }

            // 3. لوحة تقرير الطالب المختار
            return (
                <div className={`p-4 md:p-8 max-w-6xl mx-auto ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 gap-4 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-emerald-600 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-emerald-600/50">📊</div>
                            <div>
                                <h1 className="text-2xl font-black text-white">{isArabic ? `تقرير: ${selectedStudent.student_name}` : `Report: ${selectedStudent.student_name}`}</h1>
                                <p className="text-blue-200 font-bold text-sm">{selectedStudent.curriculum_system} • {selectedStudent.grade_level}</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setIsArabic(!isArabic)} className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                            <button onClick={() => { setSelectedStudent(null); setMyKids([]); }} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-sm border border-red-500/50 transition">
                                {isArabic ? 'تسجيل خروج' : 'Logout'}
                            </button>
                        </div>
                    </header>

                    {/* الإحصائيات */}
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="glass-card p-6 rounded-3xl border-t-4 border-orange-500">
                            <span className="text-xs font-bold text-orange-200 bg-orange-500/20 px-3 py-1 rounded-full">{isArabic ? 'المستحقات الحالية' : 'Current Dues'}</span>
                            <h3 className="text-4xl font-black mt-4 text-white">{totalDue} <span className="text-xl text-blue-200">EGP</span></h3>
                            <a href="https://ipn.eg" target="_blank" className="block text-center py-2.5 mt-4 bg-orange-500 hover:bg-orange-600 text-white font-bold rounded-xl transition text-sm">
                                {isArabic ? 'سداد مباشر عبر InstaPay' : 'Pay via InstaPay'}
                            </a>
                        </div>

                        <div className="glass-card p-6 rounded-3xl border-t-4 border-blue-500">
                            <span className="text-xs font-bold text-blue-200 bg-blue-500/20 px-3 py-1 rounded-full">{isArabic ? 'إجمالي الساعات' : 'Total Hours'}</span>
                            <h3 className="text-4xl font-black mt-4 text-white">{totalHours} <span className="text-xl text-blue-200">{isArabic ? 'ساعة' : 'Hrs'}</span></h3>
                            <p className="text-sm text-blue-200 mt-2 font-bold">{isArabic ? 'زمن الحصص المنجزة' : 'Completed lesson hours'}</p>
                        </div>

                        <div className="glass-card p-6 rounded-3xl border-t-4 border-emerald-500">
                            <span className="text-xs font-bold text-emerald-200 bg-emerald-500/20 px-3 py-1 rounded-full">{isArabic ? 'عدد الحصص' : 'Total Sessions'}</span>
                            <h3 className="text-4xl font-black mt-4 text-white">{sessions.length} <span className="text-xl text-blue-200">{isArabic ? 'حصة' : 'Sessions'}</span></h3>
                            <p className="text-sm text-blue-200 mt-2 font-bold">{isArabic ? 'سجل الحضور' : 'Attendance record'}</p>
                        </div>
                    </div>

                    {/* تفاصيل الحصص */}
                    <div className="glass-card p-6 rounded-3xl">
                        <h3 className="text-xl font-black mb-6 text-white">{isArabic ? '🗓️ سجل الحصص والمحاسبة التفصيلي' : '🗓️ Session Breakdown'}</h3>
                        {sessions.length === 0 ? (
                            <p className="text-blue-200 text-center py-8 font-bold">{isArabic ? 'لا توجد حصص مسجلة حتى الآن.' : 'No sessions logged yet.'}</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-right" dir={isArabic ? 'rtl' : 'ltr'}>
                                    <thead>
                                        <tr className="border-b border-white/10 text-blue-200 text-sm">
                                            <th className="pb-3 px-4">{isArabic ? 'التاريخ' : 'Date'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'المدة' : 'Duration'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'التكلفة' : 'Cost'}</th>
                                            <th className="pb-3 px-4">{isArabic ? 'الحالة' : 'Status'}</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5 font-bold">
                                        {sessions.map((session) => (
                                            <tr key={session.id} className="hover:bg-white/5 transition">
                                                <td className="py-4 px-4 text-sm">{new Date(session.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US')}</td>
                                                <td className="py-4 px-4">{session.duration_hours} {isArabic ? 'ساعة' : 'hrs'}</td>
                                                <td className="py-4 px-4 text-orange-300">{session.calculated_cost} EGP</td>
                                                <td className="py-4 px-4">
                                                    <span className="px-3 py-1 rounded-full text-xs bg-orange-500/20 text-orange-200 border border-orange-500/30">
                                                        {isArabic ? 'مستحق' : 'Unpaid'}
                                                    </span>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ParentPortal />);
    </script>
</body>
</html>
