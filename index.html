<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المعلم | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        // مفاتيح قاعدة البيانات
        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function AdminPanel() {
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            // بيانات لوحة التحكم
            const [students, setStudents] = useState([]);
            
            // نماذج الإدخال
            const [newStudent, setNewStudent] = useState({ name: '', system: '', grade: '', rate: '' });
            const [newSession, setNewSession] = useState({ student_id: '', duration: '' });
            const [msg, setMsg] = useState('');

            // التحقق من تسجيل الدخول
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchStudents();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchStudents();
                });
            }, []);

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            // دالة تسجيل الدخول
            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError('بيانات الدخول غير صحيحة، تأكد من الإيميل وكلمة المرور.');
            }

            // دالة تسجيل الخروج
            async function handleLogout() {
                await supabase.auth.signOut();
            }

            // دالة إضافة طالب جديد
            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg('جاري إضافة الطالب...');
                const { error } = await supabase.from('students').insert([{
                    student_name: newStudent.name,
                    curriculum_system: newStudent.system,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate)
                }]);
                
                if (!error) {
                    setMsg('✅ تم إضافة الطالب بنجاح!');
                    fetchStudents();
                    setNewStudent({ name: '', system: '', grade: '', rate: '' });
                } else {
                    setMsg('❌ حدث خطأ: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            // دالة تسجيل حصة لطالب
            async function handleAddSession(e) {
                e.preventDefault();
                setMsg('جاري تسجيل الحصة...');
                const { error } = await supabase.from('sessions').insert([{
                    student_id: newSession.student_id,
                    duration_hours: parseFloat(newSession.duration)
                }]);
                
                if (!error) {
                    setMsg('✅ تم تسجيل الحصة وحساب التكلفة تلقائياً بنجاح!');
                    setNewSession({ student_id: '', duration: '' });
                } else {
                    setMsg('❌ حدث خطأ: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            // الشاشة المعروضة إذا لم يكن المستخدم مسجل الدخول (شاشة القفل)
            if (!session) {
                return (
                    <div className="flex items-center justify-center min-h-screen">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-3xl shadow-lg w-full max-w-sm border-t-8 border-gray-900">
                            <h2 className="text-2xl font-black mb-2 text-center text-gray-900">أكاديمية Jebali</h2>
                            <p className="text-sm font-bold text-gray-500 mb-8 text-center">بوابة الإدارة المركزية</p>
                            
                            {loginError && <p className="bg-red-50 text-red-600 p-3 rounded-xl mb-4 text-sm font-bold">{loginError}</p>}
                            
                            <input type="email" placeholder="البريد الإلكتروني" required className="w-full p-4 mb-4 bg-gray-50 border border-gray-200 rounded-xl font-bold outline-none focus:border-gray-900 transition" value={email} onChange={e => setEmail(e.target.value)} />
                            <input type="password" placeholder="كلمة المرور" required className="w-full p-4 mb-8 bg-gray-50 border border-gray-200 rounded-xl font-bold outline-none focus:border-gray-900 transition" value={password} onChange={e => setPassword(e.target.value)} />
                            
                            <button type="submit" className="w-full bg-gray-900 text-white font-black py-4 rounded-xl hover:bg-gray-800 transition transform hover:-translate-y-1 shadow-lg shadow-gray-200">تسجيل الدخول</button>
                        </form>
                    </div>
                );
            }

            // الشاشة المعروضة للمدير بعد الدخول السليم
            return (
                <div className="p-6 md:p-10 max-w-5xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm mb-8 gap-4 border border-gray-100">
                        <div>
                            <h1 className="text-2xl font-black text-gray-900">لوحة تحكم المعلم</h1>
                            <p className="text-sm font-bold text-gray-500 mt-1">مرحباً بك في مركز إدارة الأكاديمية</p>
                        </div>
                        <button onClick={handleLogout} className="px-5 py-2.5 bg-red-50 text-red-600 rounded-xl font-black hover:bg-red-100 transition">تسجيل خروج</button>
                    </header>

                    {/* رسائل النظام */}
                    {msg && (
                        <div className={`mb-8 p-4 font-black rounded-xl border ${msg.includes('✅') ? 'bg-emerald-50 text-emerald-700 border-emerald-100' : (msg.includes('❌') ? 'bg-red-50 text-red-700 border-red-100' : 'bg-blue-50 text-blue-700 border-blue-100')}`}>
                            {msg}
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* كارت إضافة طالب جديد */}
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-2 h-full bg-blue-500"></div>
                            <h3 className="text-xl font-black mb-6 text-gray-900">👤 إضافة طالب جديد</h3>
                            <form onSubmit={handleAddStudent} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">اسم الطالب بالكامل</label>
                                    <input type="text" placeholder="مثال: أحمد سيد" required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">النظام الدراسي</label>
                                    <input type="text" placeholder="مثال: IGCSE, IB, American" required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold" value={newStudent.system} onChange={e => setNewStudent({...newStudent, system: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">المرحلة / الصف</label>
                                    <input type="text" placeholder="مثال: Year 10 / Grade 9" required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})} />
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">تكلفة الساعة (بالجنيه)</label>
                                    <input type="number" placeholder="مثال: 400" required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold" value={newStudent.rate} onChange={e => setNewStudent({...newStudent, rate: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-blue-500 text-white font-black py-4 rounded-xl hover:bg-blue-600 transition shadow-lg shadow-blue-100 mt-2">حفظ ملف الطالب</button>
                            </form>
                        </div>

                        {/* كارت تسجيل الحصص */}
                        <div className="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-2 h-full bg-orange-500"></div>
                            <h3 className="text-xl font-black mb-6 text-gray-900">⏱️ تسجيل وقت حصة</h3>
                            <form onSubmit={handleAddSession} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">اختر الطالب</label>
                                    <select required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold outline-none" value={newSession.student_id} onChange={e => setNewSession({...newSession, student_id: e.target.value})}>
                                        <option value="">-- اضغط لاختيار الطالب --</option>
                                        {students.map(s => <option key={s.id} value={s.id}>{s.student_name} ({s.curriculum_system})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-gray-500 block mb-1">مدة الحصة بالساعات (يمكن استخدام كسور)</label>
                                    <input type="number" step="0.25" placeholder="مثال: 1.5 لساعة ونصف" required className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-bold" value={newSession.duration} onChange={e => setNewSession({...newSession, duration: e.target.value})} />
                                </div>
                                
                                <div className="p-4 bg-orange-50 border border-orange-100 rounded-xl mt-4">
                                    <p className="text-xs font-bold text-orange-800 leading-relaxed">
                                        💡 بمجرد تسجيل الحصة، ستقوم قاعدة البيانات تلقائياً بضرب المدة في سعر ساعة الطالب، وسيظهر المبلغ المطلوب للمحاسبة فوراً في لوحة الطالب.
                                    </p>
                                </div>

                                <button type="submit" className="w-full bg-orange-500 text-white font-black py-4 rounded-xl hover:bg-orange-600 transition shadow-lg shadow-orange-100 mt-2">تسجيل الحصة واعتماد التكلفة</button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPanel />);
    </script>
</body>
</html>
