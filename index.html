<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية Jebali للرياضيات | Jebali Math Academy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState } = React;

        function LandingPage() {
            const [isArabic, setIsArabic] = useState(true);

            return (
                <div className={`flex flex-col items-center justify-center min-h-screen text-slate-800 p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    
                    {/* زر تغيير اللغة */}
                    <div className="absolute top-6 left-6 right-6 flex justify-end">
                        <button 
                            onClick={() => setIsArabic(!isArabic)} 
                            className="px-6 py-2 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white font-bold rounded-full border border-white/20 transition-all shadow-lg">
                            {isArabic ? 'English' : 'العربية'}
                        </button>
                    </div>

                    <div className="max-w-6xl w-full mt-16 md:mt-0">
                        {/* الترويسة */}
                        <div className="text-center mb-16">
                            <div className="inline-block p-4 bg-white/10 rounded-3xl backdrop-blur-md mb-6 border border-white/20 shadow-2xl">
                                <span className="text-6xl">📐</span>
                            </div>
                            <h1 className="text-4xl md:text-6xl font-black text-white mb-4 drop-shadow-lg">
                                {isArabic ? 'أكاديمية Jebali للرياضيات' : 'Jebali Math Academy'}
                            </h1>
                            <p className="text-xl text-blue-200 font-bold max-w-2xl mx-auto leading-relaxed">
                                {isArabic 
                                    ? 'المنصة التعليمية الأولى التي تدمج الذكاء الاصطناعي مع المتابعة الشخصية لضمان تفوقك في الرياضيات.' 
                                    : 'The premier educational platform integrating AI with personalized tracking to ensure your excellence in mathematics.'}
                            </p>
                        </div>

                        {/* بوابات الدخول الثلاث */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            
                            {/* 1. بوابة الطالب */}
                            <a href="/student.html" className="glass-card rounded-3xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-2xl hover:shadow-blue-500/30 group cursor-pointer text-center relative overflow-hidden block">
                                <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-blue-500 transition-all group-hover:w-full group-hover:opacity-10 z-0`}></div>
                                <div className="relative z-10">
                                    <div className="text-6xl mb-6 transform group-hover:scale-110 transition-transform">👨‍🎓</div>
                                    <h2 className="text-2xl font-black mb-3 text-slate-900">{isArabic ? 'بوابة الطلاب' : 'Student Portal'}</h2>
                                    <p className="text-slate-600 font-bold mb-6 text-sm h-10">
                                        {isArabic ? 'رفع الواجبات، تقييم الذكاء الاصطناعي، ومتابعة المنهج.' : 'Upload homework, AI evaluation, and curriculum progress.'}
                                    </p>
                                    <span className="inline-block bg-blue-100 text-blue-700 px-6 py-2 rounded-full font-black text-sm group-hover:bg-blue-600 group-hover:text-white transition-colors">
                                        {isArabic ? 'دخول الطلاب \u2190' : 'Student Login \u2192'}
                                    </span>
                                </div>
                            </a>

                            {/* 2. بوابة ولي الأمر */}
                            <a href="/parent.html" className="glass-card rounded-3xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-2xl hover:shadow-emerald-500/30 group cursor-pointer text-center relative overflow-hidden block">
                                <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-emerald-500 transition-all group-hover:w-full group-hover:opacity-10 z-0`}></div>
                                <div className="relative z-10">
                                    <div className="text-6xl mb-6 transform group-hover:scale-110 transition-transform">👨‍👩‍👦</div>
                                    <h2 className="text-2xl font-black mb-3 text-slate-900">{isArabic ? 'بوابة أولياء الأمور' : 'Parent Portal'}</h2>
                                    <p className="text-slate-600 font-bold mb-6 text-sm h-10">
                                        {isArabic ? 'الكشوفات المالية، تقارير الأداء، ومتابعة الحصص.' : 'Financial statements, performance reports, and session tracking.'}
                                    </p>
                                    <span className="inline-block bg-emerald-100 text-emerald-700 px-6 py-2 rounded-full font-black text-sm group-hover:bg-emerald-600 group-hover:text-white transition-colors">
                                        {isArabic ? 'متابعة الأداء \u2190' : 'Track Performance \u2192'}
                                    </span>
                                </div>
                            </a>

                            {/* 3. بوابة المعلم والإدارة */}
                            <a href="/admin.html" className="glass-card rounded-3xl p-8 transition-all duration-300 transform hover:-translate-y-2 hover:shadow-2xl hover:shadow-orange-500/30 group cursor-pointer text-center relative overflow-hidden block">
                                <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-orange-500 transition-all group-hover:w-full group-hover:opacity-10 z-0`}></div>
                                <div className="relative z-10">
                                    <div className="text-6xl mb-6 transform group-hover:scale-110 transition-transform">👨‍🏫</div>
                                    <h2 className="text-2xl font-black mb-3 text-slate-900">{isArabic ? 'الإدارة والمعلم' : 'Teacher & Admin'}</h2>
                                    <p className="text-slate-600 font-bold mb-6 text-sm h-10">
                                        {isArabic ? 'إدارة الحسابات، تسجيل الحصص، ومراقبة النظام.' : 'Account management, session logging, and system monitoring.'}
                                    </p>
                                    <span className="inline-block bg-orange-100 text-orange-700 px-6 py-2 rounded-full font-black text-sm group-hover:bg-orange-600 group-hover:text-white transition-colors">
                                        {isArabic ? 'لوحة التحكم \u2190' : 'Dashboard \u2192'}
                                    </span>
                                </div>
                            </a>

                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LandingPage />);
    </script>
</body>
</html>
