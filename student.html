<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | Jebali Math Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function StudentPortal() {
            const [studentPhone, setStudentPhone] = useState('');
            const [password, setPassword] = useState('');
            const [studentData, setStudentData] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [isForgotMode, setIsForgotMode] = useState(false);
            const [forgotMsg, setForgotMsg] = useState('');

            async function handleLogin(e) {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                let cleanPhone = studentPhone.replace(/\D/g, '');
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .ilike('student_phone', `%${cleanPhone}%`)
                    .single();

                if (error || !data) {
                    setErrorMsg('رقم هاتف الطالب غير مسجل.');
                    setLoading(false);
                    return;
                }

                if (data.password && data.password !== password) {
                    setErrorMsg('كلمة المرور غير صحيحة!');
                    setLoading(false);
                    return;
                }

                setStudentData(data);
                fetchStudentData(data.id);
                setLoading(false);
            }

            async function handleForgotPassword(e) {
                e.preventDefault();
                let cleanPhone = studentPhone.replace(/\D/g, '');
                if (!cleanPhone) return alert('يرجى كتابة رقم الهاتف أولاً!');

                const { data, error } = await supabase
                    .from('students')
                    .select('student_name, password')
                    .ilike('student_phone', `%${cleanPhone}%`)
                    .single();

                if (error || !data) {
                    setForgotMsg('❌ لم يتم العثور على طالب بهذا الرقم.');
                    return;
                }

                // فتح واتساب الأستاذ أو تزويده بكلمة المرور مباشرة
                const teacherPhone = '201069338883';
                const msg = `مرحباً أستاذي، لقد نسيت كلمة المرور الخاصة بحسابي (${data.student_name}). أرجو تزويدي بها.`;
                window.open(`https://wa.me/${teacherPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                setForgotMsg('✅ تم توجيهك عبر الواتساب لطلب كلمة المرور من الأستاذ.');
            }

            async function fetchStudentData(studentId) {
                const { data: sessData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', studentId)
                    .order('created_at', { ascending: false });
                if (sessData) setSessions(sessData);
            }

            if (!studentData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir="rtl">
                        <div className="absolute top-6 left-6">
                            <a href="index.html" className="px-5 py-2 glass-card rounded-full font-bold text-xs hover:bg-white/20 transition flex items-center gap-2">
                                <span>🏠</span> الرئيسية
                            </a>
                        </div>

                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-3xl font-black mb-2">بوابة الطالب</h2>
                            <p className="text-blue-200 text-xs mb-6">أدخل رقم الهاتف وكلمة المرور لتسجيل الدخول</p>
                            
                            {errorMsg && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 text-xs font-bold">{errorMsg}</p>}
                            {forgotMsg && <p className="bg-emerald-500/20 text-emerald-100 p-3 rounded-xl mb-4 text-xs font-bold">{forgotMsg}</p>}

                            {!isForgotMode ? (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input type="tel" placeholder="رقم هاتف الطالب" required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={studentPhone} onChange={e => setStudentPhone(e.target.value)} />
                                    <input type="password" placeholder="كلمة المرور" required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={password} onChange={e => setPassword(e.target.value)} />
                                    <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition shadow-lg text-sm">
                                        {loading ? 'جاري التحقق...' : 'دخول البوابة'}
                                    </button>
                                    <button type="button" onClick={() => setIsForgotMode(true)} className="text-xs text-blue-300 hover:underline block w-full mt-2 font-bold">
                                        هل نسيت كلمة المرور؟
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleForgotPassword} className="space-y-4">
                                    <p className="text-xs text-blue-200">أدخل رقم هاتفك المسجل لنرسل لك كلمة المرور عبر واتساب الأستاذ:</p>
                                    <input type="tel" placeholder="رقم هاتف الطالب المسجل" required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={studentPhone} onChange={e => setStudentPhone(e.target.value)} />
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl transition text-sm">
                                        استعادة كلمة المرور عبر WhatsApp 💬
                                    </button>
                                    <button type="button" onClick={() => setIsForgotMode(false)} className="text-xs text-slate-300 hover:underline block w-full mt-2 font-bold">
                                        العودة لتسجيل الدخول
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto font-cairo" dir="rtl">
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div>
                            <h1 className="text-xl md:text-2xl font-black">أهلاً بك، {studentData.student_name} 📐</h1>
                            <p className="text-blue-200 text-xs mt-1">{studentData.curriculum_system} • {studentData.grade_level}</p>
                        </div>
                        <button onClick={() => setStudentData(null)} className="px-4 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold text-xs">خروج</button>
                    </header>

                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-lg font-black mb-4">📅 سجل حصصي والمواعيد</h3>
                        {sessions.length === 0 ? (
                            <p className="text-xs text-slate-300 text-center py-6">لا توجد حصص مسجلة بعد.</p>
                        ) : (
                            <div className="space-y-3">
                                {sessions.map(s => (
                                    <div key={s.id} className="p-4 bg-white/5 border border-white/10 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <div className="font-black text-sm text-white">{s.lesson_topic}</div>
                                            <div className="text-xs text-blue-300 mt-1">{s.strand}</div>
                                        </div>
                                        <span className="text-xs bg-orange-500/20 text-orange-300 px-3 py-1.5 rounded-xl font-black">⏱️ {s.duration_hours} ساعة</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentPortal />);
    </script>
</body>
</html>
