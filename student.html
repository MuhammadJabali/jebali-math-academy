<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | Jebali Math Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white font-cairo">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const API_WORKER_URL = 'https://jebali-api.mr-gebally.workers.dev';

        function StudentPortal() {
            const [lang, setLang] = useState('ar');
            const [loginInput, setLoginInput] = useState('');
            const [password, setPassword] = useState('');
            const [studentData, setStudentData] = useState(null);
            const [sessions, setSessions] = useState([]);
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            // وضع إنشاء كلمة المرور الأولى أو التعيين
            const [isSettingUp, setIsSettingUp] = useState(false);
            const [newEmail, setNewEmail] = useState('');
            const [newPassword, setNewPassword] = useState('');
            const [pendingStudent, setPendingStudent] = useState(null);

            const [selectedTopic, setSelectedTopic] = useState('');
            const [hwImage, setHwImage] = useState(null);
            const [submittingHw, setSubmittingHw] = useState(false);
            const [submitSuccess, setSubmitSuccess] = useState('');

            useEffect(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            }, [lang]);

            async function handleLogin(e) {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                const queryVal = loginInput.trim();
                let cleanPhone = queryVal.replace(/\D/g, '');

                // البحث بالهاتف أو الإيميل
                let query = supabase.from('students').select('*');
                if (cleanPhone.length >= 8) {
                    query = query.or(`student_phone.ilike.%${cleanPhone}%,email.ilike.%${queryVal}%`);
                } else {
                    query = query.ilike('email', `%${queryVal}%`);
                }

                const { data, error } = await query.single();

                if (error || !data) {
                    setErrorMsg(lang === 'ar' ? 'لم يتم العثور على طالب بهذا الهاتف أو البريد.' : 'Student not found.');
                    setLoading(false);
                    return;
                }

                // إذا لم يكن لديه كلمة مرور مسجلة بعد، نطلب منه تعيينها لأول مرة
                if (!data.password) {
                    setPendingStudent(data);
                    setIsSettingUp(true);
                    setLoading(false);
                    return;
                }

                if (data.password !== password) {
                    setErrorMsg(lang === 'ar' ? 'كلمة المرور غير صحيحة!' : 'Incorrect password!');
                    setLoading(false);
                    return;
                }

                setStudentData(data);
                fetchStudentSessions(data.id);
                setLoading(false);
            }

            // حفظ كلمة المرور والبريد لأول مرة
            async function handleSetupCredentials(e) {
                e.preventDefault();
                setLoading(true);

                const { error } = await supabase.from('students').update({
                    email: newEmail.trim() || pendingStudent.email,
                    password: newPassword.trim()
                }).eq('id', pendingStudent.id);

                if (error) {
                    setErrorMsg('خطأ أثناء الحفظ: ' + error.message);
                    setLoading(false);
                    return;
                }

                const updatedStudent = { ...pendingStudent, email: newEmail.trim() || pendingStudent.email, password: newPassword.trim() };
                setStudentData(updatedStudent);
                fetchStudentSessions(updatedStudent.id);
                setIsSettingUp(false);
                setLoading(false);
            }

            async function fetchStudentSessions(studentId) {
                const { data: sessData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', studentId)
                    .order('created_at', { ascending: false });
                if (sessData) setSessions(sessData);
            }

            async function handleUploadHomework(e) {
                e.preventDefault();
                if (!selectedTopic) return alert(lang === 'ar' ? 'يرجى كتابة اسم الدرس!' : 'Please enter lesson topic!');

                setSubmittingHw(true);
                setSubmitSuccess('');

                try {
                    const res = await fetch(API_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'submit_homework',
                            studentId: studentData.id,
                            topic: selectedTopic,
                            feedback: `حل مقدم من الطالب عن درس: ${selectedTopic}.`
                        })
                    });

                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Failed');

                    setSubmitSuccess(lang === 'ar' ? '✅ تم تسليم الواجب بنجاح وسيتم تصحيحه قريباً!' : '✅ Homework submitted successfully!');
                    setSelectedTopic('');
                    setHwImage(null);
                    fetchStudentSessions(studentData.id);
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setSubmittingHw(false);
                }
            }

            const forgotPassword = () => {
                const teacherPhone = '201069338883';
                const msg = `مرحباً أستاذي، لقد نسيت كلمة المرور الخاصة ببوابة الطالب. أرجو مساعدتي في استعادتها.`;
                window.open(`https://wa.me/${teacherPhone}?text=${encodeURIComponent(msg)}`, '_blank');
            };

            if (!studentData) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                        <div className="absolute top-6 left-6 flex gap-2">
                            <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-4 py-2 glass-card rounded-xl font-bold text-xs hover:bg-white/20 transition">
                                🌐 {lang === 'ar' ? 'English' : 'العربية'}
                            </button>
                            <a href="index.html" className="px-4 py-2 glass-card rounded-xl font-bold text-xs hover:bg-white/20 transition flex items-center gap-1">
                                🏠 {lang === 'ar' ? 'الرئيسية' : 'Home'}
                            </a>
                        </div>

                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-3xl font-black mb-2">{lang === 'ar' ? 'بوابة الطالب' : 'Student Portal'}</h2>
                            <p className="text-blue-200 text-xs mb-6">{lang === 'ar' ? 'أدخل رقم الهاتف أو الإيميل وكلمة المرور' : 'Enter phone/email and password'}</p>
                            
                            {errorMsg && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 text-xs font-bold">{errorMsg}</p>}

                            {!isSettingUp ? (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input type="text" placeholder={lang === 'ar' ? 'رقم الهاتف أو البريد الإلكتروني' : 'Phone or Email'} required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={loginInput} onChange={e => setLoginInput(e.target.value)} />
                                    <input type="password" placeholder={lang === 'ar' ? 'كلمة المرور' : 'Password'} required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={password} onChange={e => setPassword(e.target.value)} />
                                    <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition shadow-lg text-sm">
                                        {loading ? '...' : (lang === 'ar' ? 'دخول البوابة' : 'Login')}
                                    </button>
                                    <button type="button" onClick={forgotPassword} className="text-xs text-blue-300 hover:underline block w-full mt-2 font-bold">
                                        {lang === 'ar' ? 'هل نسيت كلمة المرور؟' : 'Forgot Password?'}
                                    </button>
                                </form>
                            ) : (
                                <form onSubmit={handleSetupCredentials} className="space-y-4">
                                    <p className="text-xs text-emerald-300 font-bold">أهلاً بك! هذه أول مرة تسجل فيها. يرجى إدخال إيميلك وكلمة مرور جديدة:</p>
                                    <input type="email" placeholder="البريد الإلكتروني الخاص بك" required className="w-full p-3 glass-input rounded-xl text-sm" value={newEmail} onChange={e => setNewEmail(e.target.value)} />
                                    <input type="password" placeholder="اختر كلمة مرور جديدة" required className="w-full p-3 glass-input rounded-xl text-sm font-bold" value={newPassword} onChange={e => setNewPassword(e.target.value)} />
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl transition text-sm">
                                        حفظ وبدء الدخول ✅
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto font-cairo" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div>
                            <h1 className="text-xl md:text-2xl font-black">{lang === 'ar' ? `أهلاً بك، ${studentData.student_name}` : `Welcome, ${studentData.student_name}`} 📐</h1>
                            <p className="text-blue-200 text-xs mt-1">{studentData.curriculum_system} • {studentData.grade_level}</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-4 py-2 glass-card rounded-xl font-bold text-xs transition">🌐 {lang === 'ar' ? 'English' : 'العربية'}</button>
                            <a href="index.html" className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs transition flex items-center gap-1">🏠 {lang === 'ar' ? 'الرئيسية' : 'Home'}</a>
                            <button onClick={() => setStudentData(null)} className="px-4 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold text-xs transition">{lang === 'ar' ? 'خروج' : 'Logout'}</button>
                        </div>
                    </header>

                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8 border border-white/10">
                        <h3 className="text-lg font-black mb-4 flex items-center gap-2"><span>📝</span> {lang === 'ar' ? 'تسليم الواجب المنزلي للأستاذ' : 'Submit Homework'}</h3>
                        {submitSuccess && <p className="mb-4 p-3 bg-emerald-500/20 text-emerald-200 rounded-xl text-xs font-bold">{submitSuccess}</p>}
                        <form onSubmit={handleUploadHomework} className="space-y-4">
                            <div>
                                <label className="text-xs text-blue-200 block mb-1">{lang === 'ar' ? 'اسم الدرس أو الموضوع:' : 'Topic:'}</label>
                                <input type="text" required placeholder={lang === 'ar' ? 'مثال: الدوال التربيعية' : 'e.g. Quadratic Functions'} className="w-full p-3 glass-input rounded-xl text-sm" value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} />
                            </div>
                            <div>
                                <label className="text-xs text-blue-200 block mb-1">{lang === 'ar' ? 'صورة الحل أو التفاصيل:' : 'Solution Image:'}</label>
                                <div className="flex items-center gap-3 bg-white/5 border border-white/20 rounded-xl p-2">
                                    <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-black transition shadow">
                                        📁 {lang === 'ar' ? 'اختر ملف الحل' : 'Choose File'}
                                        <input type="file" accept="image/*" onChange={e => setHwImage(e.target.files[0])} className="hidden" />
                                    </label>
                                    <span className="text-xs text-blue-200 font-bold">{hwImage ? hwImage.name : (lang === 'ar' ? 'لم يتم اختيار ملف' : 'No file chosen')}</span>
                                </div>
                            </div>
                            <button type="submit" disabled={submittingHw} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition text-sm shadow-lg">
                                {submittingHw ? '...' : (lang === 'ar' ? 'تسليم الواجب للأستاذ 🚀' : 'Submit Homework 🚀')}
                            </button>
                        </form>
                    </div>

                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-lg font-black mb-4 flex items-center gap-2"><span>📅</span> {lang === 'ar' ? 'سجل حصصي والمواعيد' : 'My Sessions & Schedule'}</h3>
                        {sessions.length === 0 ? (
                            <p className="text-xs text-slate-300 text-center py-6">{lang === 'ar' ? 'لا توجد حصص مسجلة بعد.' : 'No sessions recorded yet.'}</p>
                        ) : (
                            <div className="space-y-3">
                                {sessions.map(s => (
                                    <div key={s.id} className="p-4 bg-white/5 border border-white/10 rounded-2xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                                        <div>
                                            <div className="font-black text-sm text-white">{s.lesson_topic}</div>
                                            <div className="text-xs text-blue-300 mt-1 font-semibold">{s.strand} {s.skills_covered ? `• ${s.skills_covered}` : ''}</div>
                                        </div>
                                        <span className="text-xs bg-orange-500/20 text-orange-300 border border-orange-500/40 px-3 py-1.5 rounded-xl font-black">⏱️ {s.duration_hours} h</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentPortal />);
    </script>
</body>
</html>
