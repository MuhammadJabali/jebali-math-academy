<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- محرك المعادلات الرياضية العالمي KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }

        /* ضبط المعادلات الرياضية لتظهر بخطوط لاتينية صحيحة من اليسار لليمين */
        .katex { direction: ltr !important; display: inline-block; unicode-bidi: isolate; font-size: 1.15em; }
        .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const { useState, useEffect, useRef } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const _k1 = 'AQ.Ab8RN6IuH_dXqryRODB';
        const _k2 = 'sqoHJKec_OQi9VUuMl7NiAzv-86f2_w';
        const GEMINI_API_KEY = _k1 + _k2;

        const TELEGRAM_TOKEN = '8821809584:AAHaFFqJTnd1j9K4Y3-_hZdyseLRnEDsE_I';
        const TELEGRAM_CHAT_ID = '8544954637';

        // مكوّن عرض النصوص الرياضية وتفعيل KaTeX تلقائياً
        function MathView({ content, className = '' }) {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.renderMathInElement) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            }, [content]);

            return (
                <div 
                    ref={containerRef} 
                    className={`leading-relaxed whitespace-pre-wrap font-medium ${className}`}
                >
                    {content}
                </div>
            );
        }

        function StudentPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [studentPhone, setStudentPhone] = useState('');
            const [loggedInStudent, setLoggedInStudent] = useState(null);
            const [loginError, setLoginError] = useState('');
            
            const [totalCost, setTotalCost] = useState(0);
            const [isLoading, setIsLoading] = useState(false);
            const [aiFeedback, setAiFeedback] = useState('');
            const [currentScore, setCurrentScore] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [isTranslating, setIsTranslating] = useState(false);
            const [submissions, setSubmissions] = useState([]);

            const fetchSubmissions = async (studentId) => {
                const { data } = await supabase
                    .from('homework_submissions')
                    .select('*')
                    .eq('student_id', studentId)
                    .order('created_at', { ascending: false });
                if (data) setSubmissions(data);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setLoginError('');

                const cleanPhone = studentPhone.trim();
                const { data, error } = await supabase
                    .from('students')
                    .select('*')
                    .eq('student_phone', cleanPhone);

                if (error || !data || data.length === 0) {
                    setLoginError(isArabic ? 'عفواً، لا يوجد طالب مسجل برقم الهاتف هذا.' : 'No student found with this phone number.');
                    setIsLoading(false);
                    return;
                }

                const student = data[0];
                setLoggedInStudent(student);

                const { data: sessions } = await supabase
                    .from('sessions')
                    .select('calculated_cost')
                    .eq('student_id', student.id)
                    .eq('is_paid', false);
                
                const cost = sessions ? sessions.reduce((sum, s) => sum + (s.calculated_cost || 0), 0) : 0;
                setTotalCost(cost);
                fetchSubmissions(student.id);
                setIsLoading(false);
            };

            const sendTelegramNotification = async (studentName, note) => {
                const url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`;
                const text = `🔔 إشعار أكاديمية Jebali للرياضيات:\n• الطالب: ${studentName}\n• ${note}`;
                try {
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text })
                    });
                } catch (err) {
                    console.error('Telegram error:', err);
                }
            };

            // ضغط وتصغير الصورة في المتصفح لضمان سرعة الاستجابة ومنع الأخطاء
            const compressImage = (file) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const maxDim = 1280;
                            let width = img.width;
                            let height = img.height;

                            if (width > height && width > maxDim) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else if (height > maxDim) {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);

                            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
                            resolve(compressedBase64);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            };

            const callGeminiModel = async (prompt, base64Data) => {
                const models = ['gemini-2.5-flash', 'gemini-2.0-flash'];
                let lastError = null;

                for (const model of models) {
                    try {
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}`;
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-goog-api-key': GEMINI_API_KEY
                            },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: prompt },
                                        { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                                    ]
                                }]
                            })
                        });

                        const data = await response.json();
                        if (response.ok && data.candidates?.[0]?.content?.parts) {
                            const validParts = data.candidates[0].content.parts.filter(p => p.text && !p.thought);
                            return (validParts.length > 0 ? validParts : data.candidates[0].content.parts).map(p => p.text).join('\n');
                        } else if (data.error) {
                            lastError = new Error(data.error.message);
                        }
                    } catch (err) {
                        lastError = err;
                    }
                }
                throw lastError || new Error('تعذر إكمال التصحيح حالياً، يرجى المحاولة بعد لحظات');
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsAnalyzing(true);
                setAiFeedback(isArabic ? '⏳ جاري تحضير الصورة وإخطار المعلم...' : '⏳ Preparing image and notifying tutor...');
                sendTelegramNotification(loggedInStudent.student_name, '📸 قام برفع واجب منزلي جديد، وجاري التدقيق واحتساب الدرجة...');

                try {
                    const base64Data = await compressImage(file);
                    setAiFeedback(isArabic ? '⏳ جاري تدقيق الخطوات الرياضية واحتساب الدرجة بالذكاء الاصطناعي...' : '⏳ Evaluating mathematical steps with AI...');

                    // بناء البرومبت بحسب اللغة المختارة في الواجهة بدقة
                    const prompt = isArabic 
                        ? `أنت مصحح امتحانات رياضيات أول معتمد للمناهج الدولية (${loggedInStudent.curriculum_system} / ${loggedInStudent.grade_level}).
قم بفحص صورة الحل المكتوبة بخط اليد بدقة متناهية.

قواعد تنسيق الرموز الرياضية الإلزامية:
- أي صيغة رياضية أو أس أو متغير يجب كتابتها حصراً بين علامات الدولار $ مثل: $3 \\times 10^{-5}$ أو $50.5 \\times 10^{-5}$ أو $A \\times 10^n$.
- لا تكتب كلمات عربية إطلاقاً داخل علامات الدولار $.

يجب أن يكون الرد بهذا التنسيق الصارم:
TOPIC: [اسم الموضوع، مثال: Standard Form / Scientific Notation]
SCORE: [درجة رقمية من 10، مثال: 5]
FEEDBACK:
**نقاط القوة:**
[اذكر ما أصاب فيه الطالب مع كتابة كل الصيغ بالرموز الرياضية $...$]

**الأخطاء والملاحظات:**
[حلل كل فقرة (a, b, c, d) وحدد الخطأ بالرمز الرياضي والحل السليم]

**نصيحة المصحح للحصول على الدرجة الكاملة:**
[نصيحة الامتحان وقواعد الحل الكامل]`
                        : `You are an expert senior Mathematics examiner for international curricula (${loggedInStudent.curriculum_system} / ${loggedInStudent.grade_level}).
Carefully examine this handwritten math solution image.

Mandatory Math Formatting Rules:
- Write EVERY formula, variable, or power of 10 inside dollar signs using standard LaTeX, e.g. $3 \\times 10^{-5}$ or $50.5 \\times 10^{-5}$ or $A \\times 10^n$.

You must output strictly in this format in English:
TOPIC: [Topic name, e.g. Standard Form / Scientific Notation]
SCORE: [Numerical score out of 10, e.g. 5]
FEEDBACK:
**Strengths:**
[Details of correct answers with math formatted inside $...$]

**Errors & Corrections:**
[Breakdown of each part with specific corrections]

**Examiner Tips for Full Marks:**
[Crucial exam advice for accuracy marks]`;

                    const responseText = await callGeminiModel(prompt, base64Data);

                    let extractedScore = null;
                    let extractedTopic = 'Mathematics';
                    let cleanFeedback = responseText;

                    const scoreMatch = responseText.match(/(?:SCORE|الدرجة)\s*[:=]\s*([\d.]+)/i);
                    if (scoreMatch) extractedScore = parseFloat(scoreMatch[1]);

                    const topicMatch = responseText.match(/(?:TOPIC|الموضوع)\s*[:=]\s*(.+)/i);
                    if (topicMatch) extractedTopic = topicMatch[1].trim();

                    const feedbackMatch = responseText.match(/(?:FEEDBACK|التقرير)\s*[:=]?\s*([\s\S]+)/i);
                    if (feedbackMatch) cleanFeedback = feedbackMatch[1].trim();

                    setCurrentScore(extractedScore);
                    setAiFeedback(cleanFeedback);

                    await supabase.from('homework_submissions').insert([{
                        student_id: loggedInStudent.id,
                        ai_feedback: cleanFeedback,
                        score: extractedScore,
                        topic: extractedTopic
                    }]);

                    sendTelegramNotification(
                        loggedInStudent.student_name, 
                        `🎯 اكتمل التقييم!\n• الموضوع: ${extractedTopic}\n• الدرجة المستحقة: ${extractedScore != null ? extractedScore + '/10' : 'تم التدقيق'}`
                    );

                    fetchSubmissions(loggedInStudent.id);
                } catch (err) {
                    console.error('AI Error:', err);
                    setAiFeedback(isArabic ? `❌ حدث خطأ أثناء التصحيح: ${err.message}` : `❌ Error during evaluation: ${err.message}`);
                } finally {
                    setIsAnalyzing(false);
                }
            };

            // ترجمة التقرير فوراً للغة الأخرى مع الحفاظ على المعادلات
            const translateCurrentFeedback = async () => {
                if (!aiFeedback || isTranslating) return;
                setIsTranslating(true);
                const targetLang = isArabic ? 'English' : 'Arabic';

                try {
                    const prompt = `Translate the following mathematics examiner report into ${targetLang}. 
Keep all mathematical expressions and LaTeX formatting inside $...$ exactly untouched and intact.
Report to translate:
${aiFeedback}`;

                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const d = await res.json();
                    if (d.candidates?.[0]?.content?.parts?.[0]?.text) {
                        setAiFeedback(d.candidates[0].content.parts[0].text);
                    }
                } catch (e) {
                    console.error('Translation error:', e);
                } finally {
                    setIsTranslating(false);
                }
            };

            const averageScore = submissions.filter(s => s.score != null).length > 0 
                ? (submissions.filter(s => s.score != null).reduce((sum, s) => sum + parseFloat(s.score), 0) / submissions.filter(s => s.score != null).length).toFixed(1)
                : null;

            if (!loggedInStudent) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <div className="absolute top-6 left-6 right-6 flex justify-between">
                            <a href="/" className="px-5 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-6 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                        </div>
                        
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md text-center shadow-2xl">
                            <div className="text-6xl mb-6">👨‍‍🎓</div>
                            <h2 className="text-3xl font-black mb-2">{isArabic ? 'بوابة الطلاب' : 'Student Portal'}</h2>
                            <p className="text-blue-200 font-bold text-sm mb-6">{isArabic ? 'أدخل رقم هاتفك المسجل للدخول لحسابك' : 'Enter registered phone number to access'}</p>
                            
                            {loginError && (
                                <p className="bg-red-500/20 border border-red-500/50 text-red-100 p-3 rounded-xl mb-4 text-sm font-bold">
                                    {loginError}
                                </p>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <input 
                                    type="tel" 
                                    required 
                                    placeholder={isArabic ? 'رقم هاتف الطالب' : 'Student Phone'} 
                                    value={studentPhone} 
                                    onChange={(e) => setStudentPhone(e.target.value)} 
                                    className="w-full p-4 glass-input rounded-xl font-bold text-center text-lg outline-none focus:border-blue-400"
                                />
                                <button type="submit" disabled={!studentPhone || isLoading} className="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-blue-500/30 disabled:opacity-50">
                                    {isLoading ? '...' : (isArabic ? 'دخول ومتابعة' : 'Login')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`p-4 md:p-8 max-w-6xl mx-auto ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 gap-4 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-blue-500/50">🎓</div>
                            <div>
                                <h1 className="text-2xl font-black text-white">{loggedInStudent.student_name}</h1>
                                <p className="text-blue-200 font-bold text-sm">{loggedInStudent.curriculum_system} - {loggedInStudent.grade_level}</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <a href="/" className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-6 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                            <button onClick={() => { setLoggedInStudent(null); setStudentPhone(''); }} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-sm border border-red-500/50 transition">
                                {isArabic ? 'خروج' : 'Logout'}
                            </button>
                        </div>
                    </header>

                    {/* الإحصائيات */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden flex flex-col justify-between group">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-orange-500`}></div>
                            <div>
                                <span className="text-xs font-bold text-orange-200 bg-orange-500/20 px-3 py-1 rounded-full border border-orange-500/30">
                                    {isArabic ? 'المستحقات المعلقة' : 'Pending Dues'}
                                </span>
                                <h3 className="text-4xl font-black mt-6 text-white">{totalCost} <span className="text-xl text-blue-200">EGP</span></h3>
                                <p className="text-sm text-blue-200 mt-2 font-bold">{isArabic ? 'إجمالي الحصص غير المسددة' : 'Unpaid sessions only'}</p>
                            </div>
                            <a href="https://ipn.eg" target="_blank" className="text-center py-4 mt-8 bg-orange-500 hover:bg-orange-600 text-white font-black rounded-xl w-full transition shadow-lg shadow-orange-500/30">
                                {isArabic ? 'سداد عبر InstaPay' : 'Pay via InstaPay'}
                            </a>
                        </div>

                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-indigo-500`}></div>
                            <span className="text-xs font-bold text-indigo-200 bg-indigo-500/20 px-3 py-1 rounded-full border border-indigo-500/30">
                                {isArabic ? 'المعدل الأكاديمي للواجبات' : 'Average Homework Score'}
                            </span>
                            <div className="mt-6">
                                <h3 className="text-4xl font-black text-white">
                                    {averageScore ? `${averageScore} ` : '-- '}
                                    <span className="text-xl text-indigo-300">/ 10</span>
                                </h3>
                                <p className="text-sm text-blue-200 mt-2 font-bold">
                                    {isArabic ? `بناءً على ${submissions.length} واجب تم تسليمه` : `Based on ${submissions.length} tasks`}
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* بطاقة التقييم الذكي مع دعم KaTeX وترجمة فورية */}
                    <div className="glass-card p-8 rounded-3xl relative overflow-hidden mb-8">
                        <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-indigo-500`}></div>
                        <h4 className="text-2xl font-black mb-2 text-white">{isArabic ? 'التصحيح الذكي وفق معايير الاختبارات 🤖' : 'AI Homework Examiner 🤖'}</h4>
                        <p className="text-blue-200 font-bold mb-6 text-sm">{isArabic ? 'ارفع صورة حلك بخط اليد لاحتساب الدرجة بدقة وعرض المعادلات بالصيغة الدولية' : 'Upload handwritten solution for instant method marks evaluation'}</p>
                        
                        <input type="file" accept="image/*" id="hw-upload" className="hidden" onChange={handleImageUpload} disabled={isAnalyzing} />
                        <label htmlFor="hw-upload" className="inline-block px-10 py-4 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-xl cursor-pointer transition shadow-lg shadow-blue-500/40">
                            {isAnalyzing ? (isArabic ? '⏳ جاري التصحيح...' : '⏳ Evaluating...') : (isArabic ? '📸 رفع صورة الواجب' : '📸 Upload Homework')}
                        </label>
                        
                        {aiFeedback && (
                            <div className="mt-8 p-6 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-sm">
                                <div className="flex flex-wrap justify-between items-center mb-4 gap-2">
                                    {currentScore != null && (
                                        <div className="inline-flex items-center gap-2 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 px-4 py-2 rounded-xl font-black text-lg">
                                            <span>🎯 {isArabic ? 'الدرجة المستحقة:' : 'Score:'}</span>
                                            <span>{currentScore} / 10</span>
                                        </div>
                                    )}
                                    <button 
                                        onClick={translateCurrentFeedback} 
                                        disabled={isTranslating}
                                        className="px-4 py-2 bg-white/10 hover:bg-white/20 text-blue-200 border border-white/20 rounded-xl text-xs font-bold transition flex items-center gap-1.5"
                                    >
                                        <span>🌐</span> {isTranslating ? '...' : (isArabic ? 'ترجمة التقرير للإنجليزية' : 'Translate to Arabic')}
                                    </button>
                                </div>

                                <h5 className="font-black text-indigo-300 mb-3 text-lg">✨ {isArabic ? 'تقرير وتوصيات المصحح:' : 'Examiner Report:'}</h5>
                                
                                {/* عرض التقرير مع دعم KaTeX للأسس والمعادلات */}
                                <MathView content={aiFeedback} className="text-slate-100 text-base" />
                            </div>
                        )}
                    </div>

                    {/* سجل الواجبات السابقة */}
                    <div className="glass-card p-8 rounded-3xl">
                        <h4 className="text-xl font-black mb-6 text-white">{isArabic ? '📚 سجل الواجبات والدرجات السابقة' : '📚 Graded Submissions History'}</h4>
                        {submissions.length === 0 ? (
                            <p className="text-blue-200 text-center py-6 font-bold">{isArabic ? 'لا توجد واجبات مسجلة حتى الآن.' : 'No previous submissions found.'}</p>
                        ) : (
                            <div className="space-y-4">
                                {submissions.map((sub, idx) => (
                                    <div key={sub.id} className="p-5 bg-white/5 border border-white/10 rounded-2xl">
                                        <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                            <div className="flex items-center gap-3">
                                                <span className="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full font-bold">
                                                    {sub.topic || (isArabic ? `واجب #${submissions.length - idx}` : `Task #${submissions.length - idx}`)}
                                                </span>
                                                {sub.score != null && (
                                                    <span className="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-3 py-1 rounded-full font-black">
                                                        🎯 {sub.score} / 10
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-xs text-blue-200 font-bold">
                                                {new Date(sub.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' })}
                                            </span>
                                        </div>
                                        <MathView content={sub.ai_feedback} className="text-sm text-slate-200" />
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentPortal />);
    </script>
</body>
</html>
