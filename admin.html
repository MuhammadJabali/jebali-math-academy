<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Jebali Math Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة الساعة التناظرية (Analog Clock) الرسمية -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdtimepicker@2.0.2/dist/mdtimepicker.min.css">
    
    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        
        *, *::before, *::after { box-sizing: border-box; }
        html, body { max-width: 100vw; overflow-x: hidden; }
        .glass-card, div, form, table { max-width: 100%; word-wrap: break-word; }
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        
        body { background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #111827 60%, #030712 100%); }
        .center-glow { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 650px; height: 650px; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(37, 99, 235, 0.12) 45%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; z-index: 0; }

        .glass-card { background: rgba(30, 58, 95, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
        
        .glass-input { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            color-scheme: dark; 
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(100%) brightness(200%);
            cursor: pointer;
        }
        
        .mdtimepicker { direction: ltr; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen text-white font-cairo overflow-x-hidden relative selection:bg-orange-500 selection:text-white">

    <div class="center-glow"></div>

    <div class="relative z-10 p-4 md:p-8 max-w-7xl mx-auto">
        <!-- الهيدر وزر اللغة -->
        <header class="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-tr from-orange-500 to-blue-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg">📐</div>
                <div>
                    <h1 id="mainTitle" class="text-2xl font-black">لوحة التحكم | Jebali Math Academy</h1>
                    <p id="mainSubtitle" class="text-blue-300 text-xs font-bold mt-1">نظام الإدارة الشامل والمتابعة المالية</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="toggleLang()" id="langBtn" class="px-4 py-2 glass-card rounded-xl font-bold text-xs hover:bg-white/20 transition flex items-center gap-1">🌐 English</button>
                <a href="index.html" id="homeBtn" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs transition flex items-center gap-1">🏠 الرئيسية</a>
                <button onclick="logoutAdmin()" id="logoutBtn" class="px-4 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold text-xs transition">خروج</button>
            </div>
        </header>

        <!-- الإحصائيات المالية -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-6 rounded-3xl border border-emerald-500/30 text-center">
                <h3 id="statCollectedText" class="text-xs text-emerald-300 font-bold mb-2 bg-emerald-500/20 inline-block px-3 py-1 rounded-lg">إجمالي المبالغ المحصلة</h3>
                <div class="text-3xl font-black mt-2" id="collectedAmount">0 <span class="text-lg text-slate-400">EGP</span></div>
            </div>
            <div class="glass-card p-6 rounded-3xl border border-orange-500/30 text-center">
                <h3 id="statPendingText" class="text-xs text-orange-300 font-bold mb-2 bg-orange-500/20 inline-block px-3 py-1 rounded-lg">إجمالي المستحقات المعلقة (قيد الانتظار)</h3>
                <div class="text-3xl font-black mt-2" id="pendingAmount">0 <span class="text-lg text-slate-400">EGP</span></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            
            <!-- نموذج توثيق وتعديل الحصة -->
            <div class="glass-card p-6 rounded-3xl h-fit border border-blue-500/30">
                <h3 id="sessionFormTitle" class="text-lg font-black mb-4 flex items-center gap-2"><span>📚</span> توثيق وتعديل الحصص</h3>
                
                <form id="sessionForm" class="space-y-4">
                    <input type="hidden" id="editSessionId" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label id="lblSelectStudent" class="text-xs text-blue-200 block mb-1">اختر الطالب:</label>
                            <select id="sessionStudentSelect" onchange="handleStudentSelectionChange()" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="">-- تحميل الطلاب --</option>
                            </select>
                        </div>
                        <div>
                            <label id="lblSelectSystem" class="text-xs text-blue-200 block mb-1">النظام التعليمي:</label>
                            <select id="sessionSystemSelect" onchange="updateStrandsDropdown()" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="National (Arabic)">National (Egyptian - عربي)</option>
                                <option value="National (Languages)">National (Egyptian - لغات)</option>
                                <option value="National (Egyptian)" class="hidden">National (Egyptian)</option>
                                <option value="IGCSE">IGCSE</option>
                                <option value="American Diploma">American Diploma</option>
                                <option value="IB">IB</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label id="lblDate" class="text-xs text-blue-200 block mb-1">التاريخ:</label>
                            <input type="date" id="sessionDate" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800 text-center" />
                        </div>
                        <div>
                            <label id="lblStartTime" class="text-xs text-blue-200 block mb-1">وقت البدء:</label>
                            <div class="relative">
                                <input type="text" id="sessionStart" readonly required placeholder="--:-- --" class="w-full p-3 pl-10 glass-input rounded-xl text-sm bg-slate-800 cursor-pointer text-center font-mono" />
                                <svg class="w-5 h-5 absolute left-3 top-3.5 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                        <div>
                            <label id="lblEndTime" class="text-xs text-blue-200 block mb-1">وقت الانتهاء:</label>
                            <div class="relative">
                                <input type="text" id="sessionEnd" readonly required placeholder="--:-- --" class="w-full p-3 pl-10 glass-input rounded-xl text-sm bg-slate-800 cursor-pointer text-center font-mono" />
                                <svg class="w-5 h-5 absolute left-3 top-3.5 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div id="liveDurationDisplay" class="text-xs text-emerald-400 font-bold text-center hidden"></div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label id="lblLocation" class="text-xs text-blue-200 block mb-1">مكان انعقاد الحصة:</label>
                            <select id="sessionLocation" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="Online (Zoom)">أونلاين (Zoom)</option>
                                <option value="Center">سنتر تعليمي (Center)</option>
                                <option value="Home">منزل الطالب</option>
                            </select>
                        </div>
                        <div>
                            <label id="lblStrand" class="text-xs text-blue-200 block mb-1">🎯 الوحدات أو المهارات:</label>
                            <select id="sessionStrandSelect" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="">-- اختر الوحدة من القاعدة --</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-white/10 pt-4 mt-2">
                        <div>
                            <label id="lblRate" class="text-xs text-blue-200 block mb-1">سعر الساعة (EGP):</label>
                            <input type="number" id="sessionHourlyRate" step="10" required value="400" class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                        </div>
                        <div>
                            <label id="lblExtra" class="text-xs text-blue-200 block mb-1">تكلفة إضافية / خصم (EGP):</label>
                            <input type="number" id="sessionAdditionalCost" step="10" required value="0" placeholder="أضف (سالب) للخصم" class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                        </div>
                    </div>

                    <div>
                        <label id="lblTopic" class="text-xs text-blue-200 block mb-1">عنوان الدرس / الموضوع:</label>
                        <input type="text" id="sessionTopicInput" required placeholder="مثال: Lesson 1 - Proportion" class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                    </div>

                    <div class="flex gap-2">
                        <button type="submit" id="sessionSubmitBtn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition shadow-lg text-sm">
                            وثّق الحصة (وتسجيلها كمعلقة)
                        </button>
                        <button type="button" id="cancelSessionEditBtn" onclick="resetSessionForm()" class="hidden px-4 bg-slate-600 hover:bg-slate-700 rounded-xl text-sm font-bold transition">إلغاء التعديل</button>
                    </div>
                </form>
            </div>

            <!-- إدارة الطلاب -->
            <div class="glass-card p-6 rounded-3xl h-fit">
                <h3 id="studentFormTitle" class="text-lg font-black mb-4 flex items-center gap-2"><span>👤</span> إدارة ملفات الطلاب</h3>
                
                <form id="addStudentForm" class="space-y-4">
                    <input type="hidden" id="editStudentId" value="">
                    <div>
                        <input type="text" id="addName" required placeholder="اسم الطالب الثلاثي" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="addPhone" required placeholder="رقم هاتف الطالب" class="w-full p-3 glass-input rounded-xl text-sm" />
                        <input type="text" id="addParentPhone" required placeholder="رقم هاتف ولي الأمر" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="addSystem" onchange="updateGradesDropdown()" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800 text-white">
                            <option value="National (Arabic)">National (Egyptian - عربي)</option>
                            <option value="National (Languages)">National (Egyptian - لغات)</option>
                            <option value="IGCSE">IGCSE</option>
                            <option value="American Diploma">American Diploma</option>
                            <option value="IB">IB</option>
                        </select>
                        <select id="addGrade" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800 text-white">
                            <option value="">-- اختر الصف الدراسي --</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="email" id="addEmail" placeholder="البريد الإلكتروني (اختياري)" class="w-full p-3 glass-input rounded-xl text-sm" />
                        <input type="text" id="addPass" required placeholder="كلمة المرور (للدخول)" class="w-full p-3 glass-input
