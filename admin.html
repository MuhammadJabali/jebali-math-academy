<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب المتقدمة | Jebali Math Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX لعرض المعادلات الرياضية باحترافية -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; }
        .math-box { background: rgba(0, 0, 0, 0.3); border-right: 4px solid #f97316; padding: 12px; border-radius: 8px; font-size: 1.1rem; margin: 8px 0; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white font-cairo">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const API_WORKER_URL = 'https://jebali-api.mr-gebally.workers.dev';

        function StudentPortal() {
            const [lang, setLang] = useState('ar');
            const [authSession, setAuthSession] = useState(null);
            const [studentData, setStudentData] = useState(null);
            
            const [loginInput, setLoginInput] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [successMsg, setSuccessMsg] = useState('');
            const [authMode, setAuthMode] = useState('login');

            const [sessions, setSessions] = useState([]);
            
            // حالات مساعد الجبر الذكي والاختبار الذاتي
            const [selectedTopic, setSelectedTopic] = useState('');
            const [submittingHw, setSubmittingHw] = useState(false);
            const [submitSuccess, setSubmitSuccess] = useState('');

            // مسألة اختبار ذاتي تجريبية تفاعلية
            const [selfTestAnswer, setSelfTestAnswer] = useState('');
            const [testResultMsg, setTestResultMsg] = useState('');

            useEffect(() => {
                document.documentElement.lang = lang;
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

                supabase.auth.getSession().then(({ data: { session } }) => {
                    setAuthSession(session);
                    if (session) fetchStudentProfile(session.user.email);
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setAuthSession(session);
                    if (session) fetchStudentProfile(session.user.email);
                    else {
                        setStudentData(null);
                        setSessions([]);
                    }
                });
            }, [lang]);

            // تفعيل KaTeX تلقائياً عند تحميل البيانات
            useEffect(() => {
                setTimeout(() => {
                    if (window.renderMathInElement) {
                        window.renderMathInElement(document.body, {
                            delimiters: [
                                {left: "$$", right: "$$", display: true},
                                {left: "$", right: "$", display: false}
                            ]
                        });
                    }
                }, 500);
            }, [studentData, sessions]);

            async function fetchStudentProfile(userEmail) {
                const { data } = await supabase
                    .from('students')
                    .select('*')
                    .ilike('email', userEmail)
                    .single();

                if (data) {
                    setStudentData(data);
                    fetchStudentSessions(data.id);
                } else {
                    setStudentData({ student_name: 'الطالب', curriculum_system: 'General', grade_level: 'N/A' });
                }
            }

            async function fetchStudentSessions(studentId) {
                const { data: sessData } = await supabase
                    .from('sessions')
                    .select('*')
                    .eq('student_id', studentId)
                    .order('created_at', { ascending: false });
                if (sessData) setSessions(sessData);
            }

            async function handleLogin(e) {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');

                let targetEmail = loginInput.trim();
                if (!targetEmail.includes('@')) {
                    const cleanPhone = targetEmail.replace(/\D/g, '');
                    const { data: stRecord } = await supabase
                        .from('students')
                        .select('email')
                        .ilike('student_phone', `%${cleanPhone}%`)
                        .single();

                    if (!stRecord || !stRecord.email) {
                        setErrorMsg(lang === 'ar' ? 'لم يتم العثور على بريد مسجل لهذا الهاتف.' : 'No email found.');
                        setLoading(false);
                        return;
                    }
                    targetEmail = stRecord.email;
                }

                const { error } = await supabase.auth.signInWithPassword({ email: targetEmail, password });
                if (error) setErrorMsg(lang === 'ar' ? 'خطأ في بيانات الدخول.' : 'Invalid credentials.');
                setLoading(false);
            }

            async function handleForgotPassword(e) {
                e.preventDefault();
                if (!loginInput) return;
                setLoading(true);
                setErrorMsg('');
                setSuccessMsg('');

                let targetEmail = loginInput.trim();
                if (!targetEmail.includes('@')) {
                    const cleanPhone = targetEmail.replace(/\D/g, '');
                    const { data: stRecord } = await supabase.from('students').select('email').ilike('student_phone', `%${cleanPhone}%`).single();
                    if (stRecord && stRecord.email) targetEmail = stRecord.email;
                }

                const { error } = await supabase.auth.resetPasswordForEmail(targetEmail, { redirectTo: window.location.href });
                if (error) setErrorMsg('Error: ' + error.message);
                else setSuccessMsg(lang === 'ar' ? '📬 تم إرسال رابط استعادة كلمة المرور إلى بريدك!' : '📬 Reset link sent!');
                setLoading(false);
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleUploadHomework(e) {
                e.preventDefault();
                if (!selectedTopic) return;
                setSubmittingHw(true);
                setSubmitSuccess('');
                try {
                    await fetch(API_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'submit_homework', studentId: studentData?.id || 0, topic: selectedTopic, feedback: 'حل واجب رياضي مقدم من الطالب.' })
                    });
                    setSubmitSuccess(lang === 'ar' ? '✅ تم تسليم الواجب بنجاح للأستاذ!' : '✅ Homework submitted!');
                    setSelectedTopic('');
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setSubmittingHw(false);
                }
            }

            // معالجة حل الاختبار الذاتي وإرساله للمعلم
            async function handleSelfTestSubmit(e) {
                e.preventDefault();
                if (!selfTestAnswer) return;
                setTestResultMsg(lang === 'ar' ? '⏳ جاري إرسال الحل للأستاذ للمراجعة...' : '⏳ Submitting answer...');
                
                try {
                    await fetch(API_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'submit_homework',
                            studentId: studentData?.id || 0,
                            topic: 'اختبار ذاتي تفاعلي: حل المعادلة التربيعية',
                            feedback: `إجابة الطالب في الاختبار الذاتي: ${selfTestAnswer}`
                        })
                    });
                    setTestResultMsg(lang === 'ar' ? '🎉 تم إرسال الحل بنجاح وسيتم تقييمه من الأستاذ قريباً!' : '🎉 Answer submitted successfully!');
                    setSelfTestAnswer('');
                } catch (err) {
                    setTestResultMsg('❌ Error submitting answer.');
                }
            }

            if (!authSession) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                        <div className="absolute top-6 left-6 flex gap-2">
                            <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-4 py-2 glass-card rounded-xl font-bold text-xs hover:bg-white/20 transition">
                                🌐 {lang === 'ar' ? 'English' : 'العربية'}
                            </button>
                            <a href="index.html" className="px-4 py-2 glass-card rounded-xl font-bold text-xs hover:bg-white/20 transition flex items-center gap-1">
                                🏠 {lang === 'ar' ? 'الرئيسية' : 'Home'}
                            </a>
                        </div>

                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
                            <div className="text-6xl mb-4">🎓</div>
                            <h2 className="text-3xl font-black mb-2">{lang === 'ar' ? 'بوابة الطالب' : 'Student Portal'}</h2>
                            <p className="text-blue-200 text-xs mb-6">{lang === 'ar' ? 'الدخول برقم الهاتف أو البريد الإلكتروني' : 'Login via Phone or Email'}</p>
                            
                            {errorMsg && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 text-xs font-bold">{errorMsg}</p>}
                            {successMsg && <p className="bg-emerald-500/20 text-emerald-100 p-3 rounded-xl mb-4 text-xs font-bold">{successMsg}</p>}

                            {authMode === 'login' && (
                                <form onSubmit={handleLogin} className="space-y-4">
                                    <input type="text" placeholder={lang === 'ar' ? 'رقم الهاتف أو البريد الإلكتروني' : 'Phone or Email'} required className="w-full p-4 glass-input rounded-xl font-bold text-center text-sm" value={loginInput} onChange={e => setLoginInput(e.target.value)} />
                                    <input type="password" placeholder={lang === 'ar' ? 'كلمة المرور' : 'Password'} required className="w-full p-4 glass-input rounded-xl font-bold text-center" value={password} onChange={e => setPassword(e.target.value)} />
                                    <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl transition shadow-lg text-sm">
                                        {loading ? '...' : (lang === 'ar' ? 'تسجيل الدخول' : 'Login')}
                                    </button>
                                    <button type="button" onClick={() => setAuthMode('forgot')} className="text-xs text-orange-300 hover:underline block w-full mt-3 font-bold">
                                        {lang === 'ar' ? 'نسيت كلمة المرور؟' : 'Forgot Password?'}
                                    </button>
                                </form>
                            )}

                            {authMode === 'forgot' && (
                                <form onSubmit={handleForgotPassword} className="space-y-4">
                                    <p className="text-xs text-blue-200">أدخل رقم هاتفك أو بريدك لاستلام رابط الاستعادة:</p>
                                    <input type="text" placeholder="رقم الهاتف أو البريد الإلكتروني" required className="w-full p-4 glass-input rounded-xl font-bold text-center text-sm" value={loginInput} onChange={e => setLoginInput(e.target.value)} />
                                    <button type="submit" disabled={loading} className="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-3 rounded-xl transition text-sm">
                                        {loading ? '...' : 'إرسال رابط الاستعادة 📬'}
                                    </button>
                                    <button type="button" onClick={() => setAuthMode('login')} className="text-xs text-slate-300 hover:underline block w-full mt-2 font-bold">العودة لتسجيل الدخول</button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 max-w-4xl mx-auto font-cairo" dir={lang === 'ar' ? 'rtl' : 'ltr'}>
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div>
                            <h1 className="text-xl md:text-2xl font-black">{lang === 'ar' ? `أهلاً بك، ${studentData?.student_name || 'الطالب'}` : `Welcome`} 📐</h1>
                            <p className="text-blue-200 text-xs mt-1">{studentData?.curriculum_system || ''} • {studentData?.grade_level || ''}</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-4 py-2 glass-card rounded-xl font-bold text-xs transition">🌐 {lang === 'ar' ? 'English' : 'العربية'}</button>
                            <a href="index.html" className="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs transition flex items-center gap-1">🏠 {lang === 'ar' ? 'الرئيسية' : 'Home'}</a>
                            <button onClick={handleLogout} className="px-4 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold text-xs transition">{lang === 'ar' ? 'خروج' : 'Logout'}</button>
                        </div>
                    </header>

                    {/* مساعد الجبر الذكي والاختبار الذاتي التفاعلي */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8 border border-orange-500/30 bg-gradient-to-r from-orange-500/10 to-blue-600/10">
                        <h3 className="text-lg font-black mb-2 flex items-center gap-2">
                            <span>⚡</span> {lang === 'ar' ? 'مساعد الجبر الذكي والاختبار الذاتي' : 'Smart Math Assistant & Self-Test'}
                        </h3>
                        <p className="text-xs text-blue-200 mb-4">
                            {lang === 'ar' ? 'تدرب على حل المعادلات الرياضية المتقدمة بمعاملات KaTeX التفاعلية:' : 'Practice advanced math problems:'}
                        </p>

                        <div className="math-box mb-4">
                            <p className="text-xs text-orange-300 font-bold mb-1">مسألة تحدي اليوم:</p>
                            <div className="text-white font-bold my-2">
                                أوجد جذري المعادلة التربيعية الآتية باستخدام القانون العام: 
                                $$ax^2 + bx + c = 0 \implies x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$
                                التطبيق العملي: $2x^2 - 5x + 2 = 0$
                            </div>
                        </div>

                        {testResultMsg && <p className="mb-3 p-3 bg-emerald-500/20 text-emerald-200 rounded-xl text-xs font-bold">{testResultMsg}</p>}
                        
                        <form onSubmit={handleSelfTestSubmit} className="space-y-3">
                            <input 
                                type="text" 
                                required 
                                placeholder={lang === 'ar' ? 'اكتب خطوات الحل أو الناتج النهائي هنا (مثال: x = 2, x = 0.5)' : 'Enter your solution...'} 
                                className="w-full p-3 glass-input rounded-xl text-sm font-bold" 
                                value={selfTestAnswer} 
                                onChange={e => setSelfTestAnswer(e.target.value)} 
                            />
                            <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition text-sm shadow-lg flex items-center justify-center gap-2">
                                <span>🚀</span> {lang === 'ar' ? 'إرسال الإجابة للأستاذ للتقييم' : 'Submit Answer for Review'}
                            </button>
                        </form>
                    </div>

                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8 border border-white/10">
                        <h3 className="text-lg font-black mb-4 flex items-center gap-2"><span>📝</span> {lang === 'ar' ? 'تسليم الواجب المنزلي' : 'Submit Homework'}</h3>
                        {submitSuccess && <p className="mb-4 p-3 bg-emerald-500/20 text-emerald-200 rounded-xl text-xs font-bold">{submitSuccess}</p>}
                        <form onSubmit={handleUploadHomework} className="space-y-4">
                            <div>
                                <label className="text-xs text-blue-200 block mb-1">{lang === 'ar' ? 'اسم الدرس أو الموضوع:' : 'Topic:'}</label>
                                <input type="text" required placeholder="مثال: الدوال التربيعية وتطبيقاتها" className="w-full p-3 glass-input rounded-xl text-sm" value={selectedTopic} onChange={e => setSelectedTopic(e.target.value)} />
                            </div>
                            <button type="submit" disabled={submittingHw} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition text-sm shadow-lg">
                                {submittingHw ? '...' : (lang === 'ar' ? 'تسليم الواجب للأستاذ 🚀' : 'Submit Homework 🚀')}
                            </button>
                        </form>
                    </div>

                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-lg font-black mb-4 flex items-center gap-2"><span>📅</span> {lang === 'ar' ? 'سجل حصصي والمواعيد' : 'My Sessions'}</h3>
                        {sessions.length === 0 ? (
                            <p className="text-xs text-slate-300 text-center py-6">{lang === 'ar' ? 'لا توجد حصص مسجلة بعد.' : 'No sessions recorded yet.'}</p>
                        ) : (
                            <div className="space-y-3">
                                {sessions.map(s => (
                                    <div key={s.id} className="p-4 bg-white/5 border border-white/10 rounded-2xl flex justify-between items-center">
                                        <div>
                                            <div className="font-black text-sm text-white">{s.lesson_topic}</div>
                                            <div className="text-xs text-blue-300 mt-1">{s.strand}</div>
                                        </div>
                                        <span className="text-xs bg-orange-500/20 text-orange-300 px-3 py-1.5 rounded-xl font-black">⏱️ {s.duration_hours} h</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentPortal />);
    </script>
</body>
</html>
