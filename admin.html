<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الاحترافية | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- محرك المعادلات الرياضية العالمي KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: white; 
            padding-right: 14px;
            padding-left: 14px;
            text-overflow: ellipsis;
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }
        .glass-input:disabled { opacity: 0.5; cursor: not-allowed; }

        .katex { direction: ltr !important; display: inline-block; unicode-bidi: isolate; font-size: 1.1em; }
        .katex-display { margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; text-align: left; }

        /* تخصيص قائمة التحديد المتعدد للمهارات الدولية */
        select[multiple] { height: 120px; }
        select[multiple] option { padding: 8px; border-bottom: 1px solid #eee; }
        select[multiple] option:checked { background-color: #f97316 !important; color: white !important; font-weight: bold; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect, useRef } = React;

        // ملاحظة: تأكد أن هذه هي مفاتيح مشروعك الفعالة
        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const API_WORKER_URL = 'https://jebali-api.mr-gebally.workers.dev';

        function MathView({ content, className = '' }) {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && window.renderMathInElement) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            }, [content]);
            return <div ref={containerRef} className={`leading-relaxed whitespace-pre-wrap font-medium ${className}`}>{content}</div>;
        }

        function AdminPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [students, setStudents] = useState([]);
            const [sessionsList, setSessionsList] = useState([]);
            
            // جداول المناهج الجديدة
            const [egyptianLessons, setEgyptianLessons] = useState([]);
            const [internationalSkills, setInternationalSkills] = useState([]);
            
            const [newStudent, setNewStudent] = useState({ 
                name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: ''
            });
            
            // حالة تسجيل الحصة (المزدوجة)
            const [newSession, setNewSession] = useState({ 
                student_id: '', 
                duration: '', 
                // حقول المصري
                eg_term: '', eg_branch: '', eg_unit: '', eg_lesson: '',
                // حقول الدولي
                int_strand: '', int_skills: []
            });

            const [lastLoggedInfo, setLastLoggedInfo] = useState(null);
            const [msg, setMsg] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) loadAllData();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) loadAllData();
                });
            }, []);

            async function loadAllData() {
                fetchStudents();
                fetchSessions();
                fetchEgyptianCurriculum();
                fetchInternationalCurriculum();
            }

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            async function fetchSessions() {
                const { data } = await supabase.from('sessions').select('*, students(student_name, parent_phone, student_phone, curriculum_system)').order('created_at', { ascending: false }).limit(30);
                if (data) setSessionsList(data);
            }

            // جلب المنهج المصري
            async function fetchEgyptianCurriculum() {
                const { data } = await supabase.from('egyptian_lessons').select('*');
                if (data) setEgyptianLessons(data);
            }

            // جلب المنهج الدولي
            async function fetchInternationalCurriculum() {
                const { data } = await supabase.from('international_skills').select('*');
                if (data) setInternationalSkills(data);
            }

            // --- منطق الواجهة المزدوجة (Dual-Mode Logic) ---
            const selectedStudentObj = students.find(s => s.id === newSession.student_id);
            const isEgyptianMode = selectedStudentObj && selectedStudentObj.curriculum_system.includes('National');

            // تصفية المنهج المصري
            const filteredEg = egyptianLessons.filter(item => selectedStudentObj && item.grade === selectedStudentObj.grade_level);
            const egTerms = [...new Set(filteredEg.map(i => i.term))];
            const egBranches = [...new Set(filteredEg.filter(i => i.term === newSession.eg_term).map(i => i.branch))];
            const egUnits = [...new Set(filteredEg.filter(i => i.term === newSession.eg_term && i.branch === newSession.eg_branch).map(i => i.unit))];
            const egLessons = filteredEg.filter(i => i.term === newSession.eg_term && i.branch === newSession.eg_branch && i.unit === newSession.eg_unit);

            // تصفية المنهج الدولي
            const filteredInt = internationalSkills.filter(item => {
                if (!selectedStudentObj) return false;
                // مطابقة الوسم بنظام الطالب (مثال: American, IGCSE)
                return item.system_tag?.toLowerCase().includes(selectedStudentObj.curriculum_system.toLowerCase().split(' ')[0]);
            });
            const intStrands = [...new Set(filteredInt.map(i => i.strand))];
            const availableIntSkills = filteredInt.filter(i => i.strand === newSession.int_strand);

            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError(isArabic ? 'بيانات الدخول غير صحيحة.' : 'Invalid credentials.');
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg('⏳ جاري الإضافة...');
                const { error } = await supabase.from('students').insert([{
                    student_name: newStudent.name,
                    student_phone: newStudent.student_phone.trim(),
                    parent_phone: newStudent.parent_phone.trim(),
                    curriculum_system: newStudent.system,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate)
                }]);
                
                if (!error) {
                    setMsg('✅ تم إضافة الطالب بنجاح!');
                    fetchStudents();
                    setNewStudent({ name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: '' });
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            async function handleAddSession(e) {
                e.preventDefault();
                setMsg('⏳ جاري توثيق الحصة في قاعدة البيانات...');
                
                const duration = parseFloat(newSession.duration);
                let lessonTopic = '';
                let strandName = '';
                let skillsCovered = '';

                // تجهيز البيانات حسب النظام للجدول الرئيسي `sessions`
                if (isEgyptianMode) {
                    strandName = newSession.eg_branch; // الفرع
                    lessonTopic = newSession.eg_unit;  // الوحدة
                    skillsCovered = newSession.eg_lesson; // الدرس
                } else {
                    strandName = newSession.int_strand;
                    lessonTopic = 'International Module';
                    // حفظ أسماء المهارات كنص كنسخة احتياطية
                    const selectedSkillNames = availableIntSkills.filter(s => newSession.int_skills.includes(s.id.toString())).map(s => s.skill_name);
                    skillsCovered = selectedSkillNames.join(' | ');
                }

                // 1. إدراج الحصة في جدول sessions
                const { data: sessionData, error: sessionError } = await supabase.from('sessions').insert([{
                    student_id: newSession.student_id,
                    duration_hours: duration,
                    strand: strandName,
                    lesson_topic: lessonTopic,
                    skills_covered: skillsCovered,
                    is_paid: false
                }]).select();
                
                if (sessionError) {
                    setMsg('❌ خطأ في تسجيل الحصة: ' + sessionError.message);
                    return setTimeout(() => setMsg(''), 4000);
                }

                const insertedSessionId = sessionData[0].id;

                // 2. إذا كان دولي، نقوم بربط المهارات في جدول الربط session_international_skills (Many-to-Many)
                if (!isEgyptianMode && newSession.int_skills.length > 0) {
                    const skillLinks = newSession.int_skills.map(skillId => ({
                        session_id: insertedSessionId,
                        skill_id: skillId
                    }));
                    
                    const { error: linkError } = await supabase.from('session_international_skills').insert(skillLinks);
                    if (linkError) console.error("Error linking skills:", linkError);
                }
                
                setMsg('✅ تم توثيق الحصة الأكاديمية بنجاح!');
                setLastLoggedInfo({
                    student: selectedStudentObj,
                    duration: duration,
                    cost: duration * (selectedStudentObj.hourly_rate || 0),
                    strand: strandName,
                    topic: lessonTopic,
                    skill: skillsCovered,
                    isEgyptian: isEgyptianMode
                });
                
                // تفريغ الحقول
                setNewSession({ student_id: '', duration: '', eg_term: '', eg_branch: '', eg_unit: '', eg_lesson: '', int_strand: '', int_skills: [] });
                fetchSessions();
                setTimeout(() => setMsg(''), 4000);
            }

            const sendWhatsApp = (target) => {
                if (!lastLoggedInfo) return;
                const { student, duration, cost, strand, topic, skill, isEgyptian } = lastLoggedInfo;

                const formatPhone = (p) => {
                    let clean = (p || '').replace(/\D/g, '');
                    if (clean.startsWith('0')) clean = '2' + clean;
                    return clean;
                };
                const parentPhone = formatPhone(student.parent_phone);
                const studentPhone = formatPhone(student.student_phone);
                const totalUnpaid = sessionsList.filter(s => s.student_id === student.id && !s.is_paid).reduce((sum, s) => sum + (s.calculated_cost || 0), 0) + cost;

                // تخصيص التقرير بناءً على النظام
                let academicDetails = '';
                if (isEgyptian) {
                    academicDetails = `\n📚 *التقرير الأكاديمي:*\n• الفرع: ${strand}\n• الوحدة: ${topic}\n• الدرس: ${skill}`;
                } else {
                    academicDetails = `\n📚 *التقرير الأكاديمي:*\n• Strand: ${strand}\n• Skills Covered:\n- ${skill.replace(/ \| /g, '\n- ')}`;
                }

                // رسالة ولي الأمر (شاملة التفاصيل المالية وتشفيرها لمنع القطع)
                const parentMsg = `مرحباً بحضرتك، من أكاديمية Jebali للرياضيات 📐\n\nتم تسجيل حصة جديدة للطالب/ة: *${student.student_name}*\n• المدة: ${duration} ساعة (${cost} جنيه مصري)${academicDetails}\n\n• إجمالي المستحقات غير المسددة: *${totalUnpaid} جنيه مصري*\n\nللسداد عبر InstaPay أو المحافظ الإلكترونية، ويمكنكم متابعة تفاصيل الواجبات عبر رابط الأكاديمية:\nhttps://jebali-math-academy.pages.dev/parent.html`;

                // رسالة الطالب (أكاديمية فقط)
                const studentMsg = `مرحباً ${student.student_name} 📐\nتم تسجيل حصتك اليوم بنجاح (${duration} ساعة).${academicDetails}\nتأكد من تسليم واجبك لتصحيحه فوراً عبر بوابتك:\nhttps://jebali-math-academy.pages.dev/student.html`;

                if (target === 'parent') {
                    if (!parentPhone) return alert('رقم ولي الأمر غير مسجل!');
                    window.open(`https://wa.me/${parentPhone}?text=${encodeURIComponent(parentMsg)}`, '_blank');
                } else if (target === 'student') {
                    if (!studentPhone) return alert('رقم الطالب غير مسجل!');
                    window.open(`https://wa.me/${studentPhone}?text=${encodeURIComponent(studentMsg)}`, '_blank');
                } else if (target === 'both') {
                    if (parentPhone) window.open(`https://wa.me/${parentPhone}?text=${encodeURIComponent(parentMsg)}`, '_blank');
                    if (studentPhone) setTimeout(() => window.open(`https://wa.me/${studentPhone}?text=${encodeURIComponent(studentMsg)}`, '_blank'), 600);
                }
            };

            async function togglePaymentStatus(sessionId, currentStatus) {
                await supabase.from('sessions').update({ is_paid: !currentStatus }).eq('id', sessionId);
                fetchSessions();
            }

            async function deleteSession(sessionId) {
                if (!window.confirm('هل أنت متأكد من حذف هذه الحصة؟')) return;
                await supabase.from('sessions').delete().eq('id', sessionId);
                fetchSessions();
            }

            if (!session) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir="rtl">
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">👨‍🏫</div>
                                <h2 className="text-3xl font-black">تسجيل الدخول</h2>
                            </div>
                            {loginError && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 font-bold text-center">{loginError}</p>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="email" placeholder="البريد الإلكتروني" required className="w-full p-4 glass-input rounded-xl font-bold" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="كلمة المرور" required className="w-full p-4 glass-input rounded-xl font-bold" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl">دخول</button>
                            </form>
                        </div>
                    </div>
                );
            }

            const totalCollected = sessionsList.filter(s => s.is_paid).reduce((acc, s) => acc + (s.calculated_cost || 0), 0);
            const totalPending = sessionsList.filter(s => !s.is_paid).reduce((acc, s) => acc + (s.calculated_cost || 0), 0);

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto font-cairo" dir="rtl">
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-3xl">🛡️</div>
                            <div>
                                <h1 className="text-2xl font-black">لوحة الإدارة (Dual-Mode Architecture)</h1>
                                <p className="text-blue-200 font-bold text-sm">متصل بـ Supabase بنجاح 🟢</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="px-5 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold">خروج</button>
                    </header>

                    {msg && <div className="mb-8 p-4 font-black rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-100">{msg}</div>}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        {/* إضافة طالب */}
                        <div className="glass-card p-8 rounded-3xl relative">
                            <div className="absolute top-0 right-0 w-2 h-full bg-blue-500"></div>
                            <h3 className="text-2xl font-black mb-6">👤 إضافة طالب جديد</h3>
                            <form onSubmit={handleAddStudent} className="space-y-4">
                                <input type="text" placeholder="اسم الطالب" required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="tel" placeholder="هاتف الطالب" className="w-full p-3 glass-input rounded-xl" value={newStudent.student_phone} onChange={e => setNewStudent({...newStudent, student_phone: e.target.value})} />
                                    <input type="tel" placeholder="هاتف ولي الأمر" required className="w-full p-3 glass-input rounded-xl" value={newStudent.parent_phone} onChange={e => setNewStudent({...newStudent, parent_phone: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.system} onChange={e => setNewStudent({...newStudent, system: e.target.value, grade: ''})}>
                                        <option value="" disabled>-- النظام --</option>
                                        <option value="National (Egyptian)">National (مصري عربي/لغات)</option>
                                        <option value="IGCSE">IGCSE (British)</option>
                                        <option value="American Diploma">American Diploma</option>
                                        <option value="IB">IB</option>
                                    </select>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})}>
                                        <option value="" disabled>-- الصف --</option>
                                        {newStudent.system === 'National (Egyptian)' && (
                                            <>
                                                <option value="Grade 10">الصف الأول الثانوي</option>
                                                <option value="Grade 11">الصف الثاني الثانوي</option>
                                                <option value="Grade 12">الصف الثالث الثانوي</option>
                                            </>
                                        )}
                                        {newStudent.system === 'IGCSE' && (
                                            <><option value="Year 9">Year 9</option><option value="Year 10">Year 10</option><option value="Year 11">Year 11</option></>
                                        )}
                                        {newStudent.system === 'American Diploma' && (
                                            <><option value="Grade 9">Grade 9</option><option value="Grade 10">Grade 10</option><option value="Grade 11">Grade 11</option><option value="Grade 12">Grade 12</option></>
                                        )}
                                    </select>
                                </div>
                                <input type="number" placeholder="سعر الساعة (EGP)" required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.rate} onChange={e => setNewStudent({...newStudent, rate: e.target.value})} />
                                <button type="submit" className="w-full bg-blue-500 text-white font-black py-4 rounded-xl">حفظ الطالب</button>
                            </form>
                        </div>

                        {/* تسجيل الحصة المزدوج الذكاء */}
                        <div className="glass-card p-8 rounded-3xl relative flex flex-col justify-between">
                            <div className="absolute top-0 right-0 w-2 h-full bg-orange-500"></div>
                            <div>
                                <h3 className="text-2xl font-black mb-6">⏱️ توثيق حصة (الوضع التلقائي)</h3>
                                <form onSubmit={handleAddSession} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <select required className="w-full p-3 glass-input rounded-xl font-bold" value={newSession.student_id} onChange={e => setNewSession({...newSession, student_id: e.target.value, eg_term: '', int_strand: '', int_skills: []})}>
                                            <option value="" disabled>1. اختر الطالب (يتحدد المنهج تلقائياً)</option>
                                            {students.map(s => <option key={s.id} value={s.id}>{s.student_name} ({s.curriculum_system})</option>)}
                                        </select>
                                        <input type="number" step="0.25" required placeholder="المدة بالساعات" className="w-full p-3 glass-input rounded-xl font-bold" value={newSession.duration} onChange={e => setNewSession({...newSession, duration: e.target.value})} />
                                    </div>

                                    {/* حقول النظام المصري */}
                                    {selectedStudentObj && isEgyptianMode && (
                                        <div className="space-y-4 p-4 border border-blue-500/30 bg-blue-500/10 rounded-xl">
                                            <p className="text-xs font-bold text-blue-200">🟢 منهج مصري خطي:</p>
                                            <div className="grid grid-cols-2 gap-4">
                                                <select required className="w-full p-3 glass-input rounded-xl" value={newSession.eg_term} onChange={e => setNewSession({...newSession, eg_term: e.target.value, eg_branch: ''})}>
                                                    <option value="" disabled>-- اختر الترم --</option>
                                                    {egTerms.map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                                <select required className="w-full p-3 glass-input rounded-xl" disabled={!newSession.eg_term} value={newSession.eg_branch} onChange={e => setNewSession({...newSession, eg_branch: e.target.value, eg_unit: ''})}>
                                                    <option value="" disabled>-- الفرع --</option>
                                                    {egBranches.map(b => <option key={b} value={b}>{b}</option>)}
                                                </select>
                                            </div>
                                            <select required className="w-full p-3 glass-input rounded-xl" disabled={!newSession.eg_branch} value={newSession.eg_unit} onChange={e => setNewSession({...newSession, eg_unit: e.target.value, eg_lesson: ''})}>
                                                <option value="" disabled>-- الوحدة --</option>
                                                {egUnits.map(u => <option key={u} value={u}>{u}</option>)}
                                            </select>
                                            <select required className="w-full p-3 glass-input rounded-xl" disabled={!newSession.eg_unit} value={newSession.eg_lesson} onChange={e => setNewSession({...newSession, eg_lesson: e.target.value})}>
                                                <option value="" disabled>-- الدرس (المهارة) --</option>
                                                {egLessons.map(l => <option key={l.id} value={l.lesson_name}>{l.lesson_name}</option>)}
                                            </select>
                                        </div>
                                    )}

                                    {/* حقول النظام الدولي */}
                                    {selectedStudentObj && !isEgyptianMode && (
                                        <div className="space-y-4 p-4 border border-emerald-500/30 bg-emerald-500/10 rounded-xl">
                                            <p className="text-xs font-bold text-emerald-200">🟣 منهج دولي مهاري (Many-to-Many):</p>
                                            <select required className="w-full p-3 glass-input rounded-xl" value={newSession.int_strand} onChange={e => setNewSession({...newSession, int_strand: e.target.value, int_skills: []})}>
                                                <option value="" disabled>-- اختر المجال (Strand) --</option>
                                                {intStrands.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                            
                                            <div>
                                                <label className="text-xs text-emerald-200 mb-1 block">-- حدد المهارة أو المهارات (يمكنك اختيار أكثر من واحدة بالضغط على Ctrl أو السحب) --</label>
                                                <select 
                                                    multiple 
                                                    required 
                                                    disabled={!newSession.int_strand}
                                                    className="w-full glass-input rounded-xl font-bold" 
                                                    value={newSession.int_skills} 
                                                    onChange={e => {
                                                        const values = Array.from(e.target.selectedOptions, option => option.value);
                                                        setNewSession({...newSession, int_skills: values});
                                                    }}
                                                >
                                                    {availableIntSkills.map(sk => <option key={sk.id} value={sk.id}>{sk.skill_name}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={!selectedStudentObj} className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl mt-4 disabled:opacity-50">
                                        وثّق الحصة في Supabase
                                    </button>
                                </form>
                            </div>

                            {/* أزرار الواتساب */}
                            <div className="mt-6 pt-4 border-t border-white/10">
                                {lastLoggedInfo ? (
                                    <div>
                                        <h4 className="text-sm font-black text-blue-200 mb-2">إرسال الفاتورة والتقرير (بدون تقطيع النص):</h4>
                                        <div className="flex gap-2">
                                            <button onClick={() => sendWhatsApp('parent')} className="flex-1 py-2 bg-emerald-600 rounded-xl text-xs font-black">👨‍👩‍👦 ولي الأمر</button>
                                            <button onClick={() => sendWhatsApp('student')} className="flex-1 py-2 bg-blue-600 rounded-xl text-xs font-black">👨‍🎓 الطالب</button>
                                            <button onClick={() => sendWhatsApp('both')} className="flex-1 py-2 bg-indigo-600 rounded-xl text-xs font-black">👥 معاً</button>
                                        </div>
                                    </div>
                                ) : (
                                    <p className="text-xs text-center text-blue-200">سجل حصة لتظهر خيارات الإرسال.</p>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* سجل الحصص */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-xl font-black mb-6 text-white">💳 سجل الحصص من Supabase</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right">
                                <thead>
                                    <tr className="border-b border-white/10 text-blue-200 text-sm">
                                        <th className="pb-3 px-4">الطالب</th>
                                        <th className="pb-3 px-4">التفاصيل / المهارات</th>
                                        <th className="pb-3 px-4">التكلفة</th>
                                        <th className="pb-3 px-4">الحالة</th>
                                        <th className="pb-3 px-4">حذف</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {sessionsList.map(s => (
                                        <tr key={s.id} className="border-b border-white/5 hover:bg-white/5 transition">
                                            <td className="py-4 px-4 font-bold">{s.students?.student_name}</td>
                                            <td className="py-4 px-4 text-xs max-w-xs truncate">
                                                <div className="font-bold text-white">{s.lesson_topic}</div>
                                                <div className="text-blue-300">{s.strand}</div>
                                                <div className="text-emerald-300">{s.skills_covered}</div>
                                            </td>
                                            <td className="py-4 px-4 font-black text-orange-300">{s.calculated_cost} EGP</td>
                                            <td className="py-4 px-4">
                                                <button onClick={() => togglePaymentStatus(s.id, s.is_paid)} className={`px-3 py-1 rounded-xl text-xs font-black ${s.is_paid ? 'bg-emerald-500/20 text-emerald-300' : 'bg-orange-500 text-white'}`}>
                                                    {s.is_paid ? '✅ مسددة' : '💵 تأكيد'}
                                                </button>
                                            </td>
                                            <td className="py-4 px-4"><button onClick={() => deleteSession(s.id)} className="text-red-400 hover:text-red-200">🗑</button></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPortal />);
    </script>
</body>
</html>
