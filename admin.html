<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة الاحترافية | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- محرك المعادلات الرياضية العالمي KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }

        .katex { direction: ltr !important; display: inline-block; unicode-bidi: isolate; font-size: 1.1em; }
        .katex-display { margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; text-align: left; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect, useRef } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        const API_WORKER_URL = 'https://jebali-api.mr-gebally.workers.dev';

        function MathView({ content, className = '' }) {
            const containerRef = useRef(null);

            useEffect(() => {
                if (containerRef.current && window.renderMathInElement) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            }, [content]);

            return (
                <div 
                    ref={containerRef} 
                    className={`leading-relaxed whitespace-pre-wrap font-medium ${className}`}
                >
                    {content}
                </div>
            );
        }

        function ExamPaperView({ rawContent, studentInfo, topic }) {
            const [showAnswers, setShowAnswers] = useState(false);
            const containerRef = useRef(null);

            const splitSections = (text) => {
                if (!text) return { questionsText: '', markSchemeText: '' };
                const parts = text.split(/(?:🔑|\*\*Mark Scheme|\*\*نموذج الإجابة|Mark Scheme & Answers)/i);
                
                let qText = parts[0] || '';
                qText = qText.replace(/^[#\s]*.*(?:Targeted Remediation Practice|تمارين علاجية|Worksheet).*$/im, '').trim();

                let msText = parts.length > 1 ? parts.slice(1).join('\n').trim() : '';
                return { questionsText: qText, markSchemeText: msText };
            };

            const { questionsText, markSchemeText } = splitSections(rawContent);

            const cleanMarkdown = (txt) => {
                return (txt || '')
                    .replace(/\*\*(.*?)\*\*/g, '$1')
                    .replace(/\*(.*?)\*/g, '$1')
                    .replace(/---/g, '')
                    .trim();
            };

            useEffect(() => {
                if (containerRef.current && window.renderMathInElement) {
                    window.renderMathInElement(containerRef.current, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            }, [rawContent, showAnswers]);

            return (
                <div ref={containerRef} className="space-y-6">
                    <div id="printable-exam-content" className="bg-white text-slate-900 p-8 rounded-2xl shadow-xl font-inter border border-slate-200" dir="ltr">
                        <div className="border-b-2 border-slate-900 pb-4 mb-6">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-xl font-black tracking-tight text-slate-950 uppercase">Jebali Mathematics Academy</h1>
                                    <p className="text-xs font-bold text-blue-700 tracking-wider uppercase mt-0.5">International Assessment & Remediation Series</p>
                                </div>
                                <div className="text-right text-xs">
                                    <span className="inline-block bg-slate-100 border border-slate-300 font-bold px-2.5 py-1 rounded text-slate-800">
                                        Time: 25 Mins
                                    </span>
                                </div>
                            </div>

                            <div className="mt-4 grid grid-cols-2 gap-2 text-xs border border-slate-300 rounded-lg p-3 bg-slate-50">
                                <div><span className="text-slate-500 font-medium">Candidate Name:</span> <strong className="text-slate-900">{studentInfo?.student_name}</strong></div>
                                <div><span className="text-slate-500 font-medium">Curriculum:</span> <strong className="text-slate-900">{studentInfo?.curriculum_system} ({studentInfo?.grade_level})</strong></div>
                                <div><span className="text-slate-500 font-medium">Topic Syllabus:</span> <strong className="text-slate-900">{topic}</strong></div>
                                <div><span className="text-slate-500 font-medium">Date:</span> <strong className="text-slate-900">{new Date().toLocaleDateString('en-GB')}</strong></div>
                            </div>
                        </div>

                        <div className="bg-blue-50/60 border border-blue-200 rounded-lg p-3 mb-6 text-xs text-blue-950 leading-relaxed">
                            <strong>Instructions:</strong> Answer all questions. You must show all necessary working clearly in the spaces provided. Give your answers in the simplest index/standard form requested.
                        </div>

                        <div className="text-sm leading-loose text-slate-900 font-normal whitespace-pre-wrap">
                            {cleanMarkdown(questionsText)}
                        </div>
                    </div>

                    {markSchemeText && (
                        <div className="rounded-2xl border border-indigo-500/30 bg-slate-900/90 overflow-hidden" dir="ltr">
                            <button 
                                onClick={() => setShowAnswers(!showAnswers)}
                                className="w-full p-4 flex justify-between items-center bg-indigo-950/40 hover:bg-indigo-900/40 transition text-left"
                            >
                                <div className="flex items-center gap-2">
                                    <span className="text-lg">🔑</span>
                                    <span className="font-black text-indigo-300 text-sm">Official Mark Scheme (Tutor Reference Only)</span>
                                </div>
                                <span className="text-xs bg-indigo-500/20 text-indigo-200 px-3 py-1 rounded-full font-bold">
                                    {showAnswers ? 'Hide Mark Scheme ▲' : 'Show Mark Scheme ▼'}
                                </span>
                            </button>

                            {showAnswers && (
                                <div className="p-5 border-t border-indigo-500/20 bg-slate-950/60 text-xs text-indigo-100 whitespace-pre-wrap font-mono leading-relaxed">
                                    {cleanMarkdown(markSchemeText)}
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        function AdminPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [students, setStudents] = useState([]);
            const [sessionsList, setSessionsList] = useState([]);
            const [homeworkList, setHomeworkList] = useState([]);
            const [taxonomyList, setTaxonomyList] = useState([]);
            
            const [newStudent, setNewStudent] = useState({ 
                name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: ''
            });
            
            const [newSession, setNewSession] = useState({ 
                student_id: '', duration: '', strand: 'Geometry & Measure', lesson_topic: '', targeted_skill: '' 
            });

            const [lastLoggedInfo, setLastLoggedInfo] = useState(null);
            const [editingHw, setEditingHw] = useState(null);
            const [msg, setMsg] = useState('');

            const [practiceModal, setPracticeModal] = useState(null);
            const [isGeneratingPractice, setIsGeneratingPractice] = useState(false);
            const [generatingHwId, setGeneratingHwId] = useState(null);

            const [transCache, setTransCache] = useState({});
            const [loadingTransId, setLoadingTransId] = useState(null);

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) loadAllData();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) loadAllData();
                });
            }, []);

            async function loadAllData() {
                fetchStudents();
                fetchSessions();
                fetchHomeworks();
                fetchTaxonomy();
            }

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            async function fetchSessions() {
                const { data } = await supabase
                    .from('sessions')
                    .select('*, students(student_name, parent_phone, student_phone)')
                    .order('created_at', { ascending: false })
                    .limit(30);
                if (data) setSessionsList(data);
            }

            async function fetchHomeworks() {
                const { data } = await supabase
                    .from('homework_submissions')
                    .select('*, students(student_name, curriculum_system, grade_level, student_phone, parent_phone)')
                    .order('created_at', { ascending: false })
                    .limit(25);
                if (data) setHomeworkList(data);
            }

            async function fetchTaxonomy() {
                const { data } = await supabase.from('curriculum_taxonomy').select('*');
                if (data) setTaxonomyList(data);
            }

            // تصفية القوائم بناءً على النظام والمرحلة الخاصة بالطالب المختار
            const selectedStudentObj = students.find(s => s.id === newSession.student_id);
            const filteredTaxonomy = taxonomyList.filter(item => {
                if (!selectedStudentObj) return true;
                return item.curriculum_system === selectedStudentObj.curriculum_system && 
                       item.grade_level === selectedStudentObj.grade_level;
            });

            const uniqueTopics = [...new Set(filteredTaxonomy.map(i => i.core_topic))];
            const uniqueSkills = [...new Set(filteredTaxonomy.map(i => i.micro_skill))];

            const hasArabicLetters = (txt) => /[\u0600-\u06FF]/.test(txt || '');

            const callWorkerTranslation = async (text, targetLang) => {
                const res = await fetch(API_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'translate', text, targetLang })
                });
                const data = await res.json();
                if (!res.ok || data.error) throw new Error(data.error || 'Translation failed');
                return data.translatedText;
            };

            const handleToggleTranslate = async (subId, originalContent) => {
                if (loadingTransId) return;

                const cached = transCache[subId] || {};
                const currentDisplayed = cached.active || originalContent;
                const isCurrentlyArabic = hasArabicLetters(currentDisplayed);

                if (isCurrentlyArabic && cached.en) {
                    setTransCache(prev => ({ ...prev, [subId]: { ...cached, active: cached.en } }));
                    return;
                }
                if (!isCurrentlyArabic && cached.ar) {
                    setTransCache(prev => ({ ...prev, [subId]: { ...cached, active: cached.ar } }));
                    return;
                }

                setLoadingTransId(subId);
                const targetLang = isCurrentlyArabic ? 'English' : 'Arabic';

                try {
                    const translated = await callWorkerTranslation(currentDisplayed, targetLang);
                    const newEntry = {
                        ...cached,
                        active: translated,
                        [targetLang === 'English' ? 'en' : 'ar']: translated,
                        [isCurrentlyArabic ? 'ar' : 'en']: currentDisplayed
                    };
                    setTransCache(prev => ({ ...prev, [subId]: newEntry }));
                } catch (e) {
                    alert(`❌ ${e.message}`);
                } finally {
                    setLoadingTransId(null);
                }
            };

            const handleGenerateRemediation = async (hw) => {
                setGeneratingHwId(hw.id);
                setIsGeneratingPractice(true);

                try {
                    const res = await fetch(API_WORKER_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'generate_practice',
                            studentName: hw.students?.student_name || 'Student',
                            curriculumSystem: hw.students?.curriculum_system || 'IGCSE',
                            gradeLevel: hw.students?.grade_level || '',
                            topic: hw.topic || 'Mathematics',
                            feedback: hw.ai_feedback
                        })
                    });

                    const data = await res.json();
                    if (!res.ok || data.error) throw new Error(data.error || 'Failed to generate practice');

                    setPracticeModal({
                        student: hw.students,
                        topic: hw.topic || 'Mathematics',
                        content: data.practiceContent
                    });
                } catch (err) {
                    alert(`❌ حدث خطأ أثناء توليد التمارين: ${err.message}`);
                } finally {
                    setIsGeneratingPractice(false);
                    setGeneratingHwId(null);
                }
            };

            const handlePrintIsolatedExam = () => {
                const examEl = document.getElementById('printable-exam-content');
                if (!examEl) return;

                let iframe = document.getElementById('isolated-print-frame');
                if (!iframe) {
                    iframe = document.createElement('iframe');
                    iframe.id = 'isolated-print-frame';
                    iframe.style.position = 'fixed';
                    iframe.style.right = '0';
                    iframe.style.bottom = '0';
                    iframe.style.width = '0';
                    iframe.style.height = '0';
                    iframe.style.border = '0';
                    document.body.appendChild(iframe);
                }

                const doc = iframe.contentWindow.document;
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html lang="en" dir="ltr">
                    <head>
                        <title>${practiceModal.topic} - ${practiceModal.student?.student_name}</title>
                        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
                        <style>
                            @page {
                                size: A4 portrait;
                                margin: 15mm 15mm 15mm 15mm;
                            }
                            body {
                                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                                color: #0f172a;
                                background: #ffffff;
                                margin: 0;
                                padding: 0;
                                -webkit-print-color-adjust: exact;
                                print-color-adjust: exact;
                            }
                            .border-b-2 { border-bottom: 2px solid #0f172a; }
                            .border { border: 1px solid #cbd5e1; }
                            .rounded-lg { border-radius: 8px; }
                            .p-3 { padding: 10px 14px; }
                            .mb-6 { margin-bottom: 20px; }
                            .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
                            .bg-slate-50 { background-color: #f8fafc; }
                            .bg-blue-50\\/60 { background-color: #eff6ff; }
                            .text-xs { font-size: 11px; line-height: 1.5; }
                            .text-sm { font-size: 13.5px; line-height: 1.8; }
                            .text-xl { font-size: 18px; margin: 0; }
                            .font-black { font-weight: 900; }
                            .font-bold { font-weight: 700; }
                            .uppercase { text-transform: uppercase; }
                            .whitespace-pre-wrap { white-space: pre-wrap; }
                            .katex { font-size: 1.15em !important; color: #000000 !important; }
                            .katex-display { margin: 14px 0 !important; }
                        </style>
                    </head>
                    <body>
                        ${examEl.innerHTML}
                    </body>
                    </html>
                `);
                doc.close();

                setTimeout(() => {
                    iframe.contentWindow.focus();
                    iframe.contentWindow.print();
                }, 350);
            };

            const sendPracticeWhatsApp = () => {
                if (!practiceModal || !practiceModal.student?.student_phone) {
                    return alert(isArabic ? 'رقم هاتف الطالب غير متوفر!' : 'Student phone not found!');
                }

                let phone = practiceModal.student.student_phone.replace(/\D/g, '');
                if (phone.startsWith('0')) phone = '2' + phone;

                const parts = practiceModal.content.split(/(?:🔑|\*\*Mark Scheme|\*\*نموذج الإجابة|Mark Scheme & Answers)/i);
                let qText = parts[0].replace(/^[#\s]*.*(?:Targeted Remediation Practice|تمارين علاجية|Worksheet).*$/im, '').trim();

                const cleanText = encodeURIComponent(
                    `مرحباً ${practiceModal.student.student_name} 📐\nإليك ورقة تمارين علاجية للتدريب على درس (${practiceModal.topic}):\n\n` +
                    qText + 
                    `\n\nقم بحل المسائل بخط يدك وتسليمها قبل موعد الحصة القادمة!`
                );

                window.open(`https://wa.me/${phone}?text=${cleanText}`, '_blank');
            };

            async function togglePaymentStatus(sessionId, currentStatus) {
                const { error } = await supabase
                    .from('sessions')
                    .update({ is_paid: !currentStatus })
                    .eq('id', sessionId);

                if (!error) fetchSessions();
            }

            async function deleteSession(sessionId) {
                if (!window.confirm(isArabic ? 'هل أنت متأكد من حذف هذه الحصة؟' : 'Are you sure you want to delete this session?')) return;
                const { error } = await supabase.from('sessions').delete().eq('id', sessionId);
                if (!error) {
                    setMsg(isArabic ? '✅ تم حذف الحصة بنجاح.' : '✅ Session deleted successfully.');
                    fetchSessions();
                }
                setTimeout(() => setMsg(''), 3000);
            }

            async function deleteStudent(studentId) {
                if (!window.confirm(isArabic ? 'تحذير: سيتم حذف الطالب وجميع حصصه وواجباته. هل تود المتابعة؟' : 'Warning: This will delete student and all linked records. Continue?')) return;
                const { error } = await supabase.from('students').delete().eq('id', studentId);
                if (!error) {
                    setMsg(isArabic ? '✅ تم حذف ملف الطالب بنجاح.' : '✅ Student profile deleted.');
                    loadAllData();
                }
                setTimeout(() => setMsg(''), 3000);
            }

            async function saveTeacherReview(hwId, newScore, note) {
                const { error } = await supabase.from('homework_submissions').update({
                    score: parseFloat(newScore),
                    teacher_note: note,
                    is_reviewed: true
                }).eq('id', hwId);

                if (!error) {
                    setMsg(isArabic ? '✅ تم حفظ اعتماد المعلم وتعديل الدرجة بنجاح!' : '✅ Review & endorsement saved!');
                    setEditingHw(null);
                    fetchHomeworks();
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 3500);
            }

            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError(isArabic ? 'بيانات الدخول غير صحيحة.' : 'Invalid credentials.');
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري الإضافة...' : '⏳ Adding...');
                const { error } = await supabase.from('students').insert([{
                    student_name: newStudent.name,
                    student_phone: newStudent.student_phone.trim(),
                    parent_phone: newStudent.parent_phone.trim(),
                    curriculum_system: newStudent.system,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate)
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم إضافة الطالب بنجاح!' : '✅ Student added successfully!');
                    fetchStudents();
                    setNewStudent({ name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: '' });
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            async function handleAddSession(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري تسجيل وتوثيق الحصة الأكاديمية...' : '⏳ Logging session metadata...');
                
                const selectedStudent = students.find(s => s.id === newSession.student_id);
                const duration = parseFloat(newSession.duration);

                const { error } = await supabase.from('sessions').insert([{
                    student_id: newSession.student_id,
                    duration_hours: duration,
                    strand: newSession.strand,
                    lesson_topic: newSession.lesson_topic.trim(),
                    skills_covered: newSession.targeted_skill.trim(),
                    is_paid: false
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم تسجيل الحصة والمهارات بنجاح!' : '✅ Session and taxonomy logged!');
                    setLastLoggedInfo({
                        student: selectedStudent,
                        duration: duration,
                        cost: duration * (selectedStudent.hourly_rate || 0),
                        strand: newSession.strand,
                        topic: newSession.lesson_topic.trim(),
                        skill: newSession.targeted_skill.trim()
                    });
                    setNewSession({ student_id: '', duration: '', strand: 'Geometry & Measure', lesson_topic: '', targeted_skill: '' });
                    fetchSessions();
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            const sendWhatsApp = (target) => {
                if (!lastLoggedInfo) return;
                const { student, duration, cost, strand, topic, skill } = lastLoggedInfo;

                const formatPhone = (p) => {
                    if (!p) return '';
                    let clean = p.replace(/\D/g, '');
                    if (clean.startsWith('0')) clean = '2' + clean;
                    return clean;
                };

                const parentPhone = formatPhone(student.parent_phone);
                const studentPhone = formatPhone(student.student_phone);

                const studentUnpaidSessions = sessionsList.filter(s => s.student_id === student.id && !s.is_paid);
                const totalUnpaid = studentUnpaidSessions.reduce((sum, s) => sum + (s.calculated_cost || 0), 0) + cost;

                const academicDetails = topic ? `%0A📚 *التقرير الأكاديمي للحصة:*%0A• المجال: ${strand}%0A• المحور: ${topic}${skill ? `%0A• المهارة المعيارية: ${skill}` : ''}` : '';

                const parentMsg = isArabic 
                    ? `مرحباً بحضرتك، من أكاديمية Jebali للرياضيات 📐%0A%0Aتم تسجيل حصة جديدة للطالب/ة: *${student.student_name}*%0A• المدة: ${duration} ساعة (${cost} EGP)${academicDetails}%0A%0A• إجمالي المستحقات غير المسددة: *${totalUnpaid} جنيه*%0Aيمكنكم متابعة تفاصيل الحصص عبر بوابتكم:%0Ahttps://jebali-math-academy.pages.dev/parent.html`

                    {/* تقارير الواجبات وتوليد التمارين العلاجية */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <div className="flex items-center justify-between mb-6">
                            <div>
                                <h3 className="text-xl font-black text-white">{isArabic ? '📝 تقارير الواجبات وتوليد التمارين العلاجية' : '📝 Technical Homework Reports & Smart Remediation'}</h3>
                                <p className="text-blue-200 text-xs font-bold mt-1">{isArabic ? 'عرض خطوات الحل ومعادلات KaTeX مع إمكانية تعديل الدرجة وتوليد أوراق عمل امتحانية' : 'Method marks analysis with KaTeX, score endorsement, and AI practice generator'}</p>
                            </div>
                            <span className="text-3xl">👨‍‍🏫</span>
                        </div>

                        {homeworkList.length === 0 ? (
                            <p className="text-blue-200 text-center py-8 font-bold">{isArabic ? 'لا توجد واجبات مسلمة بعد.' : 'No homework submissions found.'}</p>
                        ) : (
                            <div className="space-y-4">
                                {homeworkList.map((hw) => {
                                    const cached = transCache[hw.id];
                                    const displayedText = cached ? cached.active : hw.ai_feedback;
                                    const isSubArabic = hasArabicLetters(displayedText);

                                    return (
                                        <div key={hw.id} className="p-5 bg-white/5 border border-white/10 rounded-2xl">
                                            <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                                <div className="flex items-center gap-3">
                                                    <span className="text-sm font-black text-white">{hw.students?.student_name || 'طالب'}</span>
                                                    <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">
                                                        📖 {hw.topic || hw.students?.curriculum_system}
                                                    </span>
                                                    {hw.score != null && (
                                                        <span className="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-0.5 rounded-full font-black">
                                                            🎯 {hw.score} / 10
                                                        </span>
                                                    )}
                                                    {hw.is_reviewed && (
                                                        <span className="text-xs bg-emerald-500/30 text-emerald-200 border border-emerald-400 px-2 py-0.5 rounded-full font-bold">
                                                            ✅ معتمد
                                                        </span>
                                                    )}
                                                </div>

                                                <div className="flex flex-wrap items-center gap-2">
                                                    <span className="text-xs text-blue-200 font-bold ml-2">
                                                        {new Date(hw.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' })}
                                                    </span>

                                                    <button 
                                                        onClick={() => handleGenerateRemediation(hw)}
                                                        disabled={isGeneratingPractice && generatingHwId === hw.id}
                                                        className="px-3 py-1 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white rounded-lg text-xs font-black transition flex items-center gap-1 shadow-md disabled:opacity-50"
                                                    >
                                                        <span>🎯</span> 
                                                        {isGeneratingPractice && generatingHwId === hw.id ? (isArabic ? '⏳ جاري التوليد...' : 'Generating...') : (isArabic ? 'توليد تمارين علاجية' : 'Generate Practice')}
                                                    </button>

                                                    <button 
                                                        onClick={() => handleToggleTranslate(hw.id, hw.ai_feedback)}
                                                        disabled={loadingTransId === hw.id}
                                                        className="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-blue-200 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                                    >
                                                        <span>🌐</span> {loadingTransId === hw.id ? '...' : (isSubArabic ? 'English ⚡' : 'عربي ⚡')}
                                                    </button>

                                                    <button 
                                                        onClick={() => setEditingHw({ id: hw.id, score: hw.score || 5, note: hw.teacher_note || '' })}
                                                        className="px-3 py-1 bg-blue-600/30 hover:bg-blue-600/50 text-blue-200 border border-blue-400/30 rounded-lg text-xs font-bold transition flex items-center gap-1"
                                                    >
                                                        <span>✏️</span> {isArabic ? 'اعتماد / تعديل' : 'Review & Edit'}
                                                    </button>
                                                </div>
                                            </div>

                                            {hw.teacher_note && (
                                                <div className="mb-3 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs font-bold text-emerald-200">
                                                    <span>👨‍🏫 ملاحظتك الحالية للطالب: </span>
                                                    <span className="text-white font-medium">{hw.teacher_note}</span>
                                                </div>
                                            )}

                                            <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5">
                                                <MathView content={displayedText} className="text-sm text-slate-100" />
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </div>

                    {/* نافذة ورقة الامتحان التفاعلية المخصصة */}
                    {practiceModal && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-3 md:p-6 z-50">
                            <div className="glass-card p-6 md:p-8 rounded-3xl max-w-3xl w-full border border-white/20 shadow-2xl max-h-[92vh] flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-4 border-b border-white/10 pb-3">
                                        <div>
                                            <h3 className="text-xl font-black text-white">📝 ورقة التمارين الامتحانية المخصصة</h3>
                                            <p className="text-xs text-blue-300 font-bold mt-1">
                                                {practiceModal.student?.student_name} • {practiceModal.topic}
                                            </p>
                                        </div>
                                        <button onClick={() => setPracticeModal(null)} className="text-slate-400 hover:text-white text-2xl font-bold">×</button>
                                    </div>

                                    <div className="overflow-y-auto max-h-[62vh] pr-1">
                                        <ExamPaperView 
                                            rawContent={practiceModal.content} 
                                            studentInfo={practiceModal.student}
                                            topic={practiceModal.topic}
                                        />
                                    </div>
                                </div>

                                <div className="flex flex-wrap gap-3 pt-4 border-t border-white/10 mt-2">
                                    <button 
                                        onClick={sendPracticeWhatsApp}
                                        className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-emerald-600/30"
                                    >
                                        <span>📲</span> {isArabic ? 'إرسال ورقة الأسئلة عبر WhatsApp' : 'Send Exam Sheet'}
                                    </button>

                                    <button 
                                        onClick={handlePrintIsolatedExam}
                                        className="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition text-sm flex items-center gap-1.5 shadow-md"
                                    >
                                        <span>🖨️</span> {isArabic ? 'طباعة ورقة الامتحان (A4)' : 'Print Exam (A4)'}
                                    </button>

                                    <button 
                                        onClick={() => setPracticeModal(null)}
                                        className="px-5 py-3 bg-white/10 hover:bg-white/20 text-slate-300 font-bold rounded-xl transition text-sm"
                                    >
                                        {isArabic ? 'إغلاق' : 'Close'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة اعتماد الواجب وتعديل الدرجة */}
                    {editingHw && (
                        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="glass-card p-6 md:p-8 rounded-3xl max-w-md w-full border border-white/20 shadow-2xl">
                                <h3 className="text-xl font-black mb-4 text-white">✏️ {isArabic ? 'اعتماد الواجب وتعديل الدرجة' : 'Endorse Homework & Override Score'}</h3>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'الدرجة المستحقة من 10:' : 'Grade out of 10:'}</label>
                                        <input 
                                            type="number" 
                                            step="0.5" 
                                            min="0" 
                                            max="10" 
                                            value={editingHw.score} 
                                            onChange={e => setEditingHw({ ...editingHw, score: e.target.value })} 
                                            className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-emerald-400"
                                        />
                                    </div>

                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'ملاحظة المعلم للطالب (تظهر في حسابه):' : 'Teacher note for student:'}</label>
                                        <textarea 
                                            rows="3" 
                                            placeholder={isArabic ? 'مثال: أحسنت! راجع معي المسألة الأخيرة في حصة الغد.' : 'e.g. Well done! Review part d with me next session.'}
                                            value={editingHw.note} 
                                            onChange={e => setEditingHw({ ...editingHw, note: e.target.value })} 
                                            className="w-full p-3 glass-input rounded-xl font-medium outline-none focus:border-emerald-400 text-sm"
                                        />
                                    </div>

                                    <div className="flex gap-3 pt-2">
                                        <button 
                                            onClick={() => saveTeacherReview(editingHw.id, editingHw.score, editingHw.note)}
                                            className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-xl transition shadow-lg shadow-emerald-600/30 text-sm"
                                        >
                                            {isArabic ? 'حفظ والاعتماد ✅' : 'Save & Endorse ✅'}
                                        </button>
                                        <button 
                                            onClick={() => setEditingHw(null)}
                                            className="px-5 py-3 bg-white/10 hover:bg-white/20 text-slate-300 font-bold rounded-xl transition text-sm"
                                        >
                                            {isArabic ? 'إغلاق' : 'Close'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* إدارة الطلاب المسجلين */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl">
                        <h3 className="text-xl font-black mb-6 text-white">{isArabic ? '👥 سجل وإدارة الطلاب المسجلين' : '👥 Registered Students Management'}</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right" dir={isArabic ? 'rtl' : 'ltr'}>
                                <thead>
                                    <tr className="border-b border-white/10 text-blue-200 text-sm">
                                        <th className="pb-3 px-4">{isArabic ? 'اسم الطالب' : 'Student Name'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'النظام والمرحلة' : 'System & Grade'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'سعر الساعة' : 'Hourly Rate'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'هاتف الطالب' : 'Student Phone'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'هاتف ولي الأمر' : 'Parent Phone'}</th>
                                        <th className="pb-3 px-4 text-center">{isArabic ? 'إجراء' : 'Action'}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5 font-bold">
                                    {students.map(st => (
                                        <tr key={st.id} className="hover:bg-white/5 transition">
                                            <td className="py-4 px-4">{st.student_name}</td>
                                            <td className="py-4 px-4 text-sm text-blue-200">{st.curriculum_system} - {st.grade_level}</td>
                                            <td className="py-4 px-4 text-emerald-300">{st.hourly_rate} EGP</td>
                                            <td className="py-4 px-4 text-sm">{st.student_phone || '-'}</td>
                                            <td className="py-4 px-4 text-sm">{st.parent_phone || '-'}</td>
                                            <td className="py-4 px-4 text-center">
                                                <button 
                                                    onClick={() => deleteStudent(st.id)}
                                                    title={isArabic ? 'حذف ملف الطالب' : 'Delete Student'}
                                                    className="p-2 hover:bg-red-500/30 text-red-300 rounded-lg transition"
                                                >
                                                    🗑
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPortal />);
    </script>
</body>
</html>
