<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة المتكاملة | Jebali Math Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX لعرض المعادلات الرياضية -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 12px; text-overflow: ellipsis; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function AdminPortal() {
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [students, setStudents] = useState([]);
            const [sessionsList, setSessionsList] = useState([]);
            const [viewingStudentModal, setViewingStudentModal] = useState(null);
            const [isEditingStudent, setIsEditingStudent] = useState(false);
            const [editStudentForm, setEditStudentForm] = useState({});

            // نموذج إضافة طالب مع البريد الإلكتروني وكلمة المرور
            const [newStudent, setNewStudent] = useState({ 
                name: '', student_phone: '', parent_phone: '', student_email: '', password: '', systemType: 'egyptian_arabic', schoolStage: 'primary', grade: '', rate: ''
            });

            const [newSession, setNewSession] = useState({ 
                student_id: '', 
                session_date: new Date().toISOString().split('T')[0],
                start_time: '14:00',
                end_time: '15:30',
                location_type: 'Online', 
                center_name: '',
                center_fees: '',
                eg_term: '', eg_branch: '', eg_lesson: '',
                int_strand: '', int_skills: []
            });

            const [lastAddedStudent, setLastAddedStudent] = useState(null);
            const [msg, setMsg] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) loadAllData();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) loadAllData();
                });
            }, []);

            async function loadAllData() {
                fetchStudents();
                fetchSessions();
            }

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            async function fetchSessions() {
                const { data } = await supabase.from('sessions').select('*, students(student_name, parent_phone, student_phone, curriculum_system)').order('created_at', { ascending: false }).limit(100);
                if (data) setSessionsList(data);
            }

            const getEgyptianGradesList = () => {
                const isLang = newStudent.systemType === 'egyptian_languages';
                const stage = newStudent.schoolStage;
                if (stage === 'primary') {
                    return isLang ? ['Primary 1 (Languages)', 'Primary 2 (Languages)', 'Primary 3 (Languages)', 'Primary 4 (Languages)', 'Primary 5 (Languages)', 'Primary 6 (Languages)'] 
                                  : ['الصف الأول الابتدائي (عربي)', 'الصف الثاني الابتدائي (عربي)', 'الصف الثالث الابتدائي (عربي)', 'الصف الرابع الابتدائي (عربي)', 'الصف الخامس الابتدائي (عربي)', 'الصف السادس الابتدائي (عربي)'];
                } else if (stage === 'prep') {
                    return isLang ? ['Prep 1 (Languages)', 'Prep 2 (Languages)', 'Prep 3 (Languages)'] 
                                  : ['الصف الأول الإعدادي (عربي)', 'الصف الثاني الإعدادي (عربي)', 'الصف الثالث الإعدادي (عربي)'];
                } else {
                    return isLang ? ['Secondary 1 (Languages)', 'Secondary 2 (Languages)', 'Secondary 3 (Languages)'] 
                                  : ['الصف الأول الثانوي (عربي)', 'الصف الثاني الثانوي (عربي)', 'الصف الثالث الثانوي (عربي)'];
                }
            };

            const selectedStudentObj = students.find(s => s.id === newSession.student_id);

            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError('بيانات الدخول غير صحيحة.');
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg('⏳ جاري إضافة الطالب وحفظ بيانات الدخول...');
                
                let systemFullName = '';
                if (newStudent.systemType === 'egyptian_arabic') systemFullName = `تعليم مصري عربي (${newStudent.grade})`;
                else if (newStudent.systemType === 'egyptian_languages') systemFullName = `تعليم مصري لغات (${newStudent.grade})`;
                else if (newStudent.systemType === 'igcse') systemFullName = 'IGCSE (British)';
                else if (newStudent.systemType === 'american') systemFullName = 'American Diploma';
                else if (newStudent.systemType === 'ib') systemFullName = 'IB (International)';

                const studentObjToInsert = {
                    student_name: newStudent.name.trim(),
                    student_phone: newStudent.student_phone.trim(),
                    parent_phone: newStudent.parent_phone.trim(),
                    email: newStudent.student_email.trim(),
                    password: newStudent.password.trim(),
                    curriculum_system: systemFullName,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate)
                };

                const { data, error } = await supabase.from('students').insert([studentObjToInsert]).select();
                
                if (!error) {
                    setMsg('✅ تم إضافة الطالب بنجاح! يمكنك إرسال بيانات الدخول عبر الواتساب أدناه.');
                    setLastAddedStudent({ ...studentObjToInsert, id: data[0].id });
                    fetchStudents();
                    setNewStudent({ name: '', student_phone: '', parent_phone: '', student_email: '', password: '', systemType: 'egyptian_arabic', schoolStage: 'primary', grade: '', rate: '' });
                } else {
                    setMsg('❌ خطأ: ' + error.message);
                }
                setTimeout(() => setMsg(''), 5000);
            }

            // إرسال تفاصيل الدخول عبر الواتساب لولي الأمر أو الطالب
            const sendWelcomeWhatsApp = (target) => {
                if (!lastAddedStudent) return;
                const { student_name, student_phone, parent_phone, email, password } = lastAddedStudent;
                
                const formatPhone = (p) => {
                    let clean = (p || '').replace(/\D/g, '');
                    if (clean.startsWith('0')) clean = '2' + clean;
                    return clean;
                };

                const targetPhone = target === 'student' ? formatPhone(student_phone) : formatPhone(parent_phone);
                if (!targetPhone) return alert('رقم الهاتف المطلوب غير متوفر!');

                const welcomeMsg = `أهلاً بحضرتك/ك في أكاديمية Jebali للرياضيات 📐\n\nتم إنشاء حساب خاص للطالب/ة: *${student_name}*\n\nيمكنكم الآن الدخول إلى بوابة الطالب أو ولي الأمر عبر الروابط التالية:\n• بوابة الطالب: https://jebali-math-academy.pages.dev/student.html\n• بوابة ولي الأمر: https://jebali-math-academy.pages.dev/parent.html\n\nبيانات الدخول الخاصة بكم:\n• البريد الإلكتروني: ${email || 'مستخدم عبر الهاتف'}\n• كلمة المرور: *${password}*\n\nنتمنى لكم دوام التفوق والنجاح!`;

                window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(welcomeMsg)}`, '_blank');
            };

            if (!session) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 font-cairo" dir="rtl">
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">👨‍🏫</div>
                                <h2 className="text-3xl font-black">لوحة الإدارة</h2>
                            </div>
                            {loginError && <p className="bg-red-500/20 text-red-100 p-3 rounded-xl mb-4 font-bold text-center">{loginError}</p>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="email" placeholder="البريد الإلكتروني" required className="w-full p-4 glass-input rounded-xl font-bold" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder="كلمة المرور" required className="w-full p-4 glass-input rounded-xl font-bold" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl">تسجيل الدخول</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto font-cairo" dir="rtl">
                    <header className="flex justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-3xl shadow-lg">📐</div>
                            <div>
                                <h1 className="text-2xl font-black">Jebali Math Academy | لوحة التحكم</h1>
                                <p className="text-blue-200 font-bold text-sm">إدارة الطلاب، كلمات المرور، وإرسال بيانات الدخول</p>
                            </div>
                        </div>
                        <button onClick={handleLogout} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold transition">خروج</button>
                    </header>

                    {msg && <div className="mb-8 p-4 font-black rounded-xl bg-emerald-500/20 border border-emerald-500/50 text-emerald-100">{msg}</div>}

                    {/* زر إرسال واتساب للطالب الجديد بعد الإضافة */}
                    {lastAddedStudent && (
                        <div className="glass-card p-6 rounded-3xl mb-8 border border-emerald-500/50 bg-emerald-500/10 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div>
                                <h4 className="font-black text-white text-base">✨ تم حفظ الطالب ({lastAddedStudent.student_name}) بنجاح!</h4>
                                <p className="text-xs text-emerald-200 mt-1">أرسل الآن بيانات الدخول وكلمة المرور عبر الواتساب:</p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => sendWelcomeWhatsApp('parent')} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition">
                                    💬 إرسال لولي الأمر
                                </button>
                                <button onClick={() => sendWelcomeWhatsApp('student')} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition">
                                    💬 إرسال للطالب
                                </button>
                            </div>
                        </div>
                    )}

                    {/* سجل الطلاب */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-xl font-black mb-6 text-white">🎓 سجل الطلاب المسجلين</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right">
                                <thead>
                                    <tr className="border-b border-white/10 text-blue-200 text-sm">
                                        <th className="pb-3 px-4">اسم الطالب</th>
                                        <th className="pb-3 px-4">النظام والصف</th>
                                        <th className="pb-3 px-4">بيانات الدخول (الإيميل / الباسورد)</th>
                                        <th className="pb-3 px-4 text-center">إدارة الملف</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {students.map(st => (
                                        <tr key={st.id} className="border-b border-white/5 hover:bg-white/5 transition">
                                            <td className="py-4 px-4 font-bold text-white">{st.student_name}</td>
                                            <td className="py-4 px-4 text-xs text-blue-200">
                                                <div>{st.curriculum_system}</div>
                                                <div className="font-semibold text-slate-300">{st.grade_level}</div>
                                            </td>
                                            <td className="py-4 px-4 text-xs">
                                                <div>📧 {st.email || 'غير مسجل'}</div>
                                                <div className="text-orange-300 font-bold">🔑 {st.password || 'غير محددة'}</div>
                                            </td>
                                            <td className="py-4 px-4 text-center">
                                                <button onClick={() => { setViewingStudentModal(st); setEditStudentForm(st); setIsEditingStudent(false); }} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl transition">
                                                    📁 فتح الملف
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        {/* إضافة طالب جديد مع البريد الإلكتروني وكلمة المرور */}
                        <div className="glass-card p-8 rounded-3xl relative">
                            <div className="absolute top-0 right-0 w-2 h-full bg-blue-500"></div>
                            <h3 className="text-2xl font-black mb-6">👤 إضافة طالب جديد وبيانات الدخول</h3>
                            <form onSubmit={handleAddStudent} className="space-y-4">
                                <input type="text" placeholder="اسم الطالب بالكامل" required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="tel" placeholder="هاتف الطالب" className="w-full p-3 glass-input rounded-xl text-sm" value={newStudent.student_phone} onChange={e => setNewStudent({...newStudent, student_phone: e.target.value})} />
                                    <input type="tel" placeholder="هاتف ولي الأمر" required className="w-full p-3 glass-input rounded-xl text-sm" value={newStudent.parent_phone} onChange={e => setNewStudent({...newStudent, parent_phone: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <input type="email" placeholder="البريد الإلكتروني للطالب" className="w-full p-3 glass-input rounded-xl text-sm" value={newStudent.student_email} onChange={e => setNewStudent({...newStudent, student_email: e.target.value})} />
                                    <input type="text" placeholder="كلمة المرور الخاصة به" required className="w-full p-3 glass-input rounded-xl text-sm font-bold" value={newStudent.password} onChange={e => setNewStudent({...newStudent, password: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold text-sm" value={newStudent.systemType} onChange={e => setNewStudent({...newStudent, systemType: e.target.value})}>
                                        <option value="egyptian_arabic">🇪🇬 تعليم مصري (عربي)</option>
                                        <option value="egyptian_languages">🌐 تعليم مصري (لغات)</option>
                                        <option value="igcse">🇬🇧 IGCSE</option>
                                        <option value="american">🇺🇸 American</option>
                                        <option value="ib">🌍 IB</option>
                                    </select>
                                    {(newStudent.systemType === 'egyptian_arabic' || newStudent.systemType === 'egyptian_languages') ? (
                                        <select required className="w-full p-3 glass-input rounded-xl font-bold text-sm" value={newStudent.schoolStage} onChange={e => setNewStudent({...newStudent, schoolStage: e.target.value})}>
                                            <option value="primary">ابتدائية</option>
                                            <option value="prep">إعدادية</option>
                                            <option value="secondary">ثانوية</option>
                                        </select>
                                    ) : (
                                        <select required className="w-full p-3 glass-input rounded-xl font-bold text-sm" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})}>
                                            <option value="" disabled>-- الصف --</option>
                                            <option value="Grade 10">Grade 10</option>
                                            <option value="Grade 11">Grade 11</option>
                                            <option value="Grade 12">Grade 12</option>
                                        </select>
                                    )}
                                </div>
                                {(newStudent.systemType === 'egyptian_arabic' || newStudent.systemType === 'egyptian_languages') && (
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold text-sm" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})}>
                                        <option value="" disabled>-- حدد الصف بدقة --</option>
                                        {getEgyptianGradesList().map(g => <option key={g} value={g}>{g}</option>)}
                                    </select>
                                )}
                                <input type="number" placeholder="سعر الساعة (EGP)" required className="w-full p-3 glass-input rounded-xl font-bold" value={newStudent.rate} onChange={e => setNewStudent({...newStudent, rate: e.target.value})} />
                                <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition">حفظ وتوليد بيانات الدخول</button>
                            </form>
                        </div>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPortal />);
    </script>
</body>
</html>
