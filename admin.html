<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function AdminPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [students, setStudents] = useState([]);
            const [sessionsList, setSessionsList] = useState([]);
            const [homeworkList, setHomeworkList] = useState([]);
            const [newStudent, setNewStudent] = useState({ 
                name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: '' 
            });
            const [newSession, setNewSession] = useState({ student_id: '', duration: '' });
            const [lastLoggedInfo, setLastLoggedInfo] = useState(null);
            const [msg, setMsg] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) loadAllData();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) loadAllData();
                });
            }, []);

            async function loadAllData() {
                fetchStudents();
                fetchSessions();
                fetchHomeworks();
            }

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            async function fetchSessions() {
                const { data } = await supabase
                    .from('sessions')
                    .select('*, students(student_name, parent_phone, student_phone)')
                    .order('created_at', { ascending: false })
                    .limit(30);
                if (data) setSessionsList(data);
            }

            async function fetchHomeworks() {
                const { data } = await supabase
                    .from('homework_submissions')
                    .select('*, students(student_name, curriculum_system)')
                    .order('created_at', { ascending: false })
                    .limit(20);
                if (data) setHomeworkList(data);
            }

            async function togglePaymentStatus(sessionId, currentStatus) {
                const { error } = await supabase
                    .from('sessions')
                    .update({ is_paid: !currentStatus })
                    .eq('id', sessionId);

                if (!error) fetchSessions();
            }

            async function deleteSession(sessionId) {
                if (!window.confirm(isArabic ? 'هل أنت متأكد من حذف هذه الحصة؟' : 'Are you sure you want to delete this session?')) return;
                const { error } = await supabase.from('sessions').delete().eq('id', sessionId);
                if (!error) {
                    setMsg(isArabic ? '✅ تم حذف الحصة بنجاح.' : '✅ Session deleted successfully.');
                    fetchSessions();
                }
                setTimeout(() => setMsg(''), 3000);
            }

            async function deleteStudent(studentId) {
                if (!window.confirm(isArabic ? 'تحذير: سيتم حذف الطالب وجميع حصصه وواجباته. هل تود المتابعة؟' : 'Warning: This will delete student and all linked records. Continue?')) return;
                const { error } = await supabase.from('students').delete().eq('id', studentId);
                if (!error) {
                    setMsg(isArabic ? '✅ تم حذف ملف الطالب بنجاح.' : '✅ Student profile deleted.');
                    loadAllData();
                }
                setTimeout(() => setMsg(''), 3000);
            }

            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError(isArabic ? 'بيانات الدخول غير صحيحة.' : 'Invalid credentials.');
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري الإضافة...' : '⏳ Adding...');
                const { error } = await supabase.from('students').insert([{
                    student_name: newStudent.name,
                    student_phone: newStudent.student_phone.trim(),
                    parent_phone: newStudent.parent_phone.trim(),
                    curriculum_system: newStudent.system,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate)
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم إضافة الطالب بنجاح!' : '✅ Student added successfully!');
                    fetchStudents();
                    setNewStudent({ name: '', student_phone: '', parent_phone: '', system: '', grade: '', rate: '' });
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            async function handleAddSession(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري التسجيل...' : '⏳ Logging session...');
                
                const selectedStudent = students.find(s => s.id === newSession.student_id);
                const duration = parseFloat(newSession.duration);

                const { error } = await supabase.from('sessions').insert([{
                    student_id: newSession.student_id,
                    duration_hours: duration,
                    is_paid: false
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم تسجيل الحصة بنجاح!' : '✅ Session logged successfully!');
                    
                    setLastLoggedInfo({
                        student: selectedStudent,
                        duration: duration,
                        cost: duration * (selectedStudent.hourly_rate || 0)
                    });

                    setNewSession({ student_id: '', duration: '' });
                    fetchSessions();
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            const sendWhatsApp = (target) => {
                if (!lastLoggedInfo) return;
                const { student, duration, cost } = lastLoggedInfo;

                const formatPhone = (p) => {
                    if (!p) return '';
                    let clean = p.replace(/\D/g, '');
                    if (clean.startsWith('0')) clean = '2' + clean;
                    return clean;
                };

                const parentPhone = formatPhone(student.parent_phone);
                const studentPhone = formatPhone(student.student_phone);

                const studentUnpaidSessions = sessionsList.filter(s => s.student_id === student.id && !s.is_paid);
                const totalUnpaid = studentUnpaidSessions.reduce((sum, s) => sum + (s.calculated_cost || 0), 0) + cost;

                const parentMsg = isArabic 
                    ? `مرحباً بحضرتك، من أكاديمية Jebali للرياضيات 📐%0A%0Aتم تسجيل حصة جديدة للطالب/ة: *${student.student_name}*%0A• المدة: ${duration} ساعة%0A• تكلفة الحصة: ${cost} جنيه مصري%0A• إجمالي المستحقات غير المسددة: *${totalUnpaid} جنيه*%0A%0Aيمكنكم متابعة تقرير الحصص والواجبات والسداد عبر الرابط:%0Ahttps://jebali-math-academy.pages.dev/parent.html`
                    : `Hello from Jebali Math Academy 📐%0A%0ANew session logged for: *${student.student_name}*%0A• Duration: ${duration} hrs%0A• Cost: ${cost} EGP%0A• Total Due: *${totalUnpaid} EGP*%0A%0AParent portal:%0Ahttps://jebali-math-academy.pages.dev/parent.html`;

                const studentMsg = isArabic
                    ? `مرحباً ${student.student_name} 📐%0Aتم تسجيل حضور حصة الرياضيات اليوم بنجاح (${duration} ساعة).%0Aيمكنك مراجعة واجباتك ورفع الحل لتصحيحه بالذكاء الاصطناعي عبر بوابتك:%0Ahttps://jebali-math-academy.pages.dev/student.html`
                    : `Hello ${student.student_name} 📐%0AYour session today (${duration} hrs) has been recorded successfully.%0AUpload homework via student portal:%0Ahttps://jebali-math-academy.pages.dev/student.html`;

                if (target === 'parent') {
                    if (!parentPhone) return alert(isArabic ? 'رقم ولي الأمر غير مسجل لهذا الطالب!' : 'Parent phone not found!');
                    window.open(`https://wa.me/${parentPhone}?text=${parentMsg}`, '_blank');
                } else if (target === 'student') {
                    if (!studentPhone) return alert(isArabic ? 'رقم هاتف الطالب غير مسجل!' : 'Student phone not found!');
                    window.open(`https://wa.me/${studentPhone}?text=${studentMsg}`, '_blank');
                } else if (target === 'both') {
                    if (!parentPhone && !studentPhone) return alert(isArabic ? 'لا توجد أرقام مسجلة للطالب أو ولي الأمر!' : 'No phone numbers registered!');
                    if (parentPhone) window.open(`https://wa.me/${parentPhone}?text=${parentMsg}`, '_blank');
                    if (studentPhone) {
                        setTimeout(() => {
                            window.open(`https://wa.me/${studentPhone}?text=${studentMsg}`, '_blank');
                        }, 500);
                    }
                }
            };

            const totalCollected = sessionsList.filter(s => s.is_paid).reduce((acc, s) => acc + (s.calculated_cost || 0), 0);
            const totalPending = sessionsList.filter(s => !s.is_paid).reduce((acc, s) => acc + (s.calculated_cost || 0), 0);

            if (!session) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <div className="absolute top-6 left-6 right-6 flex justify-between">
                            <a href="/" className="px-5 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-6 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                        </div>
                        
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">👨‍🏫</div>
                                <h2 className="text-3xl font-black">{isArabic ? 'لوحة الإدارة' : 'Admin Portal'}</h2>
                                <p className="text-blue-200 font-bold mt-2 text-sm">{isArabic ? 'أدخل بيانات الاعتماد للمتابعة' : 'Enter credentials to proceed'}</p>
                            </div>
                            
                            {loginError && <p className="bg-red-500/20 border border-red-500/50 text-red-100 p-3 rounded-xl mb-4 text-sm font-bold text-center">{loginError}</p>}
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="email" placeholder={isArabic ? 'البريد الإلكتروني' : 'Email'} required className="w-full p-4 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder={isArabic ? 'كلمة المرور' : 'Password'} required className="w-full p-4 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-orange-500/30">
                                    {isArabic ? 'تسجيل الدخول' : 'Login'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`p-4 md:p-8 max-w-6xl mx-auto ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 gap-4 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-orange-500/50">🛡️</div>
                            <div>
                                <h1 className="text-2xl font-black text-white">{isArabic ? 'مركز الإدارة والمتابعة' : 'Management & Finance'}</h1>
                                <p className="text-blue-200 font-bold text-sm">mr.gebally@gmail.com</p>
                            </div>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <a href="/" className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition flex items-center gap-2">
                                <span>🏠</span> {isArabic ? 'الرئيسية' : 'Home'}
                            </a>
                            <button onClick={() => setIsArabic(!isArabic)} className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                            <button onClick={handleLogout} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-sm border border-red-500/50 transition">
                                {isArabic ? 'خروج' : 'Logout'}
                            </button>
                        </div>
                    </header>

                    {/* الإحصائيات المالية */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="glass-card p-6 rounded-3xl border-t-4 border-emerald-500">
                            <span className="text-xs font-bold text-emerald-200 bg-emerald-500/20 px-3 py-1 rounded-full">{isArabic ? 'المبالغ المحصلة' : 'Collected Revenue'}</span>
                            <h3 className="text-4xl font-black mt-4 text-white">{totalCollected} <span className="text-xl text-blue-200">EGP</span></h3>
                            <p className="text-xs text-blue-200 mt-2 font-bold">{isArabic ? 'تم تأكيد استلامها' : 'Payment confirmed'}</p>
                        </div>
                        <div className="glass-card p-6 rounded-3xl border-t-4 border-orange-500">
                            <span className="text-xs font-bold text-orange-200 bg-orange-500/20 px-3 py-1 rounded-full">{isArabic ? 'المستحقات المعلقة' : 'Pending Receivables'}</span>
                            <h3 className="text-4xl font-black mt-4 text-white">{totalPending} <span className="text-xl text-blue-200">EGP</span></h3>
                            <p className="text-xs text-blue-200 mt-2 font-bold">{isArabic ? 'بانتظار السداد من أولياء الأمور' : 'Awaiting parent settlement'}</p>
                        </div>
                    </div>

                    {msg && (
                        <div className={`mb-8 p-4 font-black rounded-xl border ${msg.includes('✅') ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100' : 'bg-blue-500/20 border-blue-500/50 text-blue-100'} backdrop-blur-md`}>
                            {msg}
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                        {/* إضافة طالب */}
                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-blue-500`}></div>
                            <h3 className="text-2xl font-black mb-6 text-white">{isArabic ? '👤 إضافة طالب جديد' : '👤 Add Student'}</h3>
                            <form onSubmit={handleAddStudent} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'اسم الطالب بالكامل' : 'Full Name'}</label>
                                    <input type="text" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'هاتف الطالب' : 'Student Phone'}</label>
                                        <input type="tel" required placeholder="01xxxxxxxxx" className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.student_phone} onChange={e => setNewStudent({...newStudent, student_phone: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'هاتف ولي الأمر' : 'Parent Phone'}</label>
                                        <input type="tel" required placeholder="01xxxxxxxxx" className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.parent_phone} onChange={e => setNewStudent({...newStudent, parent_phone: e.target.value})} />
                                    </div>
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'النظام الدراسي' : 'Curriculum'}</label>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.system} onChange={e => setNewStudent({...newStudent, system: e.target.value})}>
                                        <option value="" disabled>{isArabic ? '-- اختر النظام الدراسي --' : '-- Select System --'}</option>
                                        <option value="IGCSE">IGCSE (British)</option>
                                        <option value="IB">IB (International Baccalaureate)</option>
                                        <option value="American Diploma">American Diploma</option>
                                        <option value="National (Languages)">National (Languages / لغات)</option>
                                        <option value="National (Arabic)">National (Arabic / عربي)</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'المرحلة / الصف' : 'Grade'}</label>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})}>
                                        <option value="" disabled>{isArabic ? '-- اختر المرحلة أو الصف --' : '-- Select Grade Level --'}</option>
                                        <option value="Grade 7 / Year 8">Grade 7 / Year 8</option>
                                        <option value="Grade 8 / Year 9">Grade 8 / Year 9</option>
                                        <option value="Grade 9 / Year 10">Grade 9 / Year 10</option>
                                        <option value="Grade 10 / Year 11">Grade 10 / Year 11</option>
                                        <option value="Grade 11 / Year 12">Grade 11 / Year 12</option>
                                        <option value="Grade 12 / Year 13">Grade 12 / Year 13</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'سعر الساعة (EGP)' : 'Hourly Rate (EGP)'}</label>
                                    <input type="number" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.rate} onChange={e => setNewStudent({...newStudent, rate: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-blue-500/30 mt-4">
                                    {isArabic ? 'حفظ ملف الطالب' : 'Save Student'}
                                </button>
                            </form>
                        </div>

                        {/* تسجيل حصة وإرسال الواتساب الفوري */}
                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden flex flex-col justify-between">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-orange-500`}></div>
                            <div>
                                <h3 className="text-2xl font-black mb-6 text-white">{isArabic ? '⏱️ تسجيل وقت حصة' : '⏱️ Log Session'}</h3>
                                <form onSubmit={handleAddSession} className="space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'اختر الطالب' : 'Select Student'}</label>
                                        <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={newSession.student_id} onChange={e => setNewSession({...newSession, student_id: e.target.value})}>
                                            <option value="" disabled>{isArabic ? '-- اضغط لاختيار الطالب --' : '-- Select Student --'}</option>
                                            {students.map(s => <option key={s.id} value={s.id}>{s.student_name} ({s.curriculum_system})</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'مدة الحصة بالساعات' : 'Duration in hours'}</label>
                                        <input type="number" step="0.25" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={newSession.duration} onChange={e => setNewSession({...newSession, duration: e.target.value})} />
                                    </div>
                                    <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-orange-500/30 mt-4">
                                        {isArabic ? 'تسجيل الحصة واعتماد التكلفة' : 'Log Session & Apply Cost'}
                                    </button>
                                </form>
                            </div>

                            {/* بطاقة إرسال الواتساب للطالب المسجل فقط */}
                            <div className="mt-8 pt-6 border-t border-white/10">
                                <h4 className="text-sm font-black text-blue-200 mb-3">{isArabic ? '📲 إرسال مطالبة عبر WhatsApp:' : '📲 Send WhatsApp Invoice:'}</h4>
                                
                                {lastLoggedInfo ? (
                                    <div className="p-4 bg-white/10 rounded-2xl border border-white/15">
                                        <div className="flex justify-between items-center mb-3">
                                            <div>
                                                <span className="text-xs text-emerald-300 font-bold block">✨ {isArabic ? 'تم التسجيل بنجاح لـ:' : 'Logged for:'}</span>
                                                <h5 className="text-base font-black text-white">{lastLoggedInfo.student.student_name} ({lastLoggedInfo.duration} {isArabic ? 'ساعة' : 'hrs'})</h5>
                                            </div>
                                            <span className="text-sm font-black text-orange-300">{lastLoggedInfo.cost} EGP</span>
                                        </div>

                                        <p className="text-xs text-blue-200 font-bold mb-3">{isArabic ? 'اختر الجهة المراد إرسال الرسالة إليها:' : 'Select recipient:'}</p>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            <button 
                                                onClick={() => sendWhatsApp('parent')}
                                                className="py-2.5 px-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black rounded-xl transition flex items-center justify-center gap-1 shadow-md">
                                                <span>👨‍👩‍👦</span> {isArabic ? 'ولي الأمر' : 'Parent'}
                                            </button>

                                            <button 
                                                onClick={() => sendWhatsApp('student')}
                                                className="py-2.5 px-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-black rounded-xl transition flex items-center justify-center gap-1 shadow-md">
                                                <span>👨‍🎓</span> {isArabic ? 'الطالب' : 'Student'}
                                            </button>

                                            <button 
                                                onClick={() => sendWhatsApp('both')}
                                                className="py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black rounded-xl transition flex items-center justify-center gap-1 shadow-md">
                                                <span>👥</span> {isArabic ? 'الاثنين معاً' : 'Both'}
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="p-4 bg-white/5 rounded-2xl border border-dashed border-white/10 text-center">
                                        <p className="text-xs text-blue-200 font-bold">
                                            {isArabic 
                                                ? '💡 حدد الطالب والمدة واضغط "تسجيل الحصة" لتظهر لك هنا خيارات الإرسال لهذا الطالب فقط.' 
                                                : '💡 Select student & log session to reveal WhatsApp send options for that student.'}
                                        </p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* إدارة الحصص وتأكيد السداد */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-xl font-black mb-6 text-white">{isArabic ? '💳 إدارة الحصص والحسابات' : '💳 Sessions Control & Accounts'}</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right" dir={isArabic ? 'rtl' : 'ltr'}>
                                <thead>
                                    <tr className="border-b border-white/10 text-blue-200 text-sm">
                                        <th className="pb-3 px-4">{isArabic ? 'الطالب' : 'Student'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'التاريخ' : 'Date'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'المدة' : 'Duration'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'التكلفة' : 'Cost'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'حالة السداد' : 'Payment Status'}</th>
                                        <th className="pb-3 px-4 text-center">{isArabic ? 'حذف' : 'Delete'}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5 font-bold">
                                    {sessionsList.map(s => (
                                        <tr key={s.id} className="hover:bg-white/5 transition">
                                            <td className="py-4 px-4">{s.students?.student_name || 'طالب'}</td>
                                            <td className="py-4 px-4 text-sm text-blue-200">{new Date(s.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US')}</td>
                                            <td className="py-4 px-4">{s.duration_hours} {isArabic ? 'ساعة' : 'hrs'}</td>
                                            <td className="py-4 px-4 text-orange-300">{s.calculated_cost} EGP</td>
                                            <td className="py-4 px-4">
                                                <button 
                                                    onClick={() => togglePaymentStatus(s.id, s.is_paid)}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-black transition ${
                                                        s.is_paid 
                                                            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-red-500/20 hover:text-red-300' 
                                                            : 'bg-orange-500 hover:bg-orange-600 text-white shadow-md'
                                                    }`}
                                                >
                                                    {s.is_paid ? (isArabic ? '✅ مسددة' : '✅ Paid') : (isArabic ? 'تأكيد السداد 💵' : 'Mark Paid 💵')}
                                                </button>
                                            </td>
                                            <td className="py-4 px-4 text-center">
                                                <button 
                                                    onClick={() => deleteSession(s.id)}
                                                    title={isArabic ? 'حذف الحصة' : 'Delete Session'}
                                                    className="p-2 hover:bg-red-500/30 text-red-300 rounded-lg transition"
                                                >
                                                    🗑️️
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* سجل وإدارة الطلاب */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl mb-8">
                        <h3 className="text-xl font-black mb-6 text-white">{isArabic ? '👥 سجل وإدارة الطلاب المسجلين' : '👥 Registered Students Management'}</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-right" dir={isArabic ? 'rtl' : 'ltr'}>
                                <thead>
                                    <tr className="border-b border-white/10 text-blue-200 text-sm">
                                        <th className="pb-3 px-4">{isArabic ? 'اسم الطالب' : 'Student Name'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'النظام والمرحلة' : 'System & Grade'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'سعر الساعة' : 'Hourly Rate'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'هاتف الطالب' : 'Student Phone'}</th>
                                        <th className="pb-3 px-4">{isArabic ? 'هاتف ولي الأمر' : 'Parent Phone'}</th>
                                        <th className="pb-3 px-4 text-center">{isArabic ? 'إجراء' : 'Action'}</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5 font-bold">
                                    {students.map(st => (
                                        <tr key={st.id} className="hover:bg-white/5 transition">
                                            <td className="py-4 px-4">{st.student_name}</td>
                                            <td className="py-4 px-4 text-sm text-blue-200">{st.curriculum_system} - {st.grade_level}</td>
                                            <td className="py-4 px-4 text-emerald-300">{st.hourly_rate} EGP</td>
                                            <td className="py-4 px-4 text-sm">{st.student_phone || '-'}</td>
                                            <td className="py-4 px-4 text-sm">{st.parent_phone || '-'}</td>
                                            <td className="py-4 px-4 text-center">
                                                <button 
                                                    onClick={() => deleteStudent(st.id)}
                                                    title={isArabic ? 'حذف ملف الطالب' : 'Delete Student'}
                                                    className="p-2 hover:bg-red-500/30 text-red-300 rounded-lg transition"
                                                >
                                                    🗑️
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* مراجعة أحدث الواجبات وتصحيحات الذكاء الاصطناعي مع الدرجة والموضوع */}
                    <div className="glass-card p-6 md:p-8 rounded-3xl">
                        <div className="flex items-center justify-between mb-6">
                            <div>
                                <h3 className="text-xl font-black text-white">{isArabic ? '📝 مراجعة الواجبات والدرجات المعتمدة' : '📝 Recent Graded Homework Submissions'}</h3>
                                <p className="text-blue-200 text-xs font-bold mt-1">{isArabic ? 'متابعة تقييمات الذكاء الاصطناعي مع الدرجة الرقمية وموضوع المسألة' : 'Monitor AI evaluations, numerical scores, and topic analysis'}</p>
                            </div>
                            <span className="text-3xl">🤖</span>
                        </div>

                        {homeworkList.length === 0 ? (
                            <p className="text-blue-200 text-center py-8 font-bold">{isArabic ? 'لا توجد واجبات مسلمة بعد.' : 'No homework submissions found.'}</p>
                        ) : (
                            <div className="space-y-4">
                                {homeworkList.map((hw) => (
                                    <div key={hw.id} className="p-5 bg-white/5 border border-white/10 rounded-2xl">
                                        <div className="flex flex-wrap justify-between items-center mb-3 gap-2">
                                            <div className="flex items-center gap-3">
                                                <span className="text-sm font-black text-white">{hw.students?.student_name || 'طالب'}</span>
                                                <span className="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">
                                                    {hw.topic || hw.students?.curriculum_system}
                                                </span>
                                                {hw.score != null && (
                                                    <span className="text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2.5 py-0.5 rounded-full font-black">
                                                        🎯 {hw.score} / 10
                                                    </span>
                                                )}
                                            </div>
                                            <span className="text-xs text-blue-200 font-bold">
                                                {new Date(hw.created_at).toLocaleDateString(isArabic ? 'ar-EG' : 'en-US', { hour: '2-digit', minute: '2-digit' })}
                                            </span>
                                        </div>
                                        <div className="bg-slate-900/60 p-4 rounded-xl border border-white/5">
                                            <p className="text-sm text-slate-200 whitespace-pre-wrap font-bold leading-relaxed">{hw.ai_feedback}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPortal />);
    </script>
</body>
</html>
