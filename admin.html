<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | أكاديمية Jebali</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.5); }
        .glass-input option { color: black; background: white; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen text-white">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const { useState, useEffect } = React;

        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        function AdminPortal() {
            const [isArabic, setIsArabic] = useState(true);
            const [session, setSession] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loginError, setLoginError] = useState('');
            
            const [students, setStudents] = useState([]);
            const [newStudent, setNewStudent] = useState({ name: '', system: '', grade: '', rate: '', parent_phone: '' });
            const [newSession, setNewSession] = useState({ student_id: '', duration: '' });
            const [msg, setMsg] = useState('');

            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setSession(session);
                    if (session) fetchStudents();
                });

                supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    if (session) fetchStudents();
                });
            }, []);

            async function fetchStudents() {
                const { data } = await supabase.from('students').select('*').order('created_at', { ascending: false });
                if (data) setStudents(data);
            }

            async function handleLogin(e) {
                e.preventDefault();
                setLoginError('');
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) setLoginError(isArabic ? 'بيانات الدخول غير صحيحة.' : 'Invalid login credentials.');
            }

            async function handleLogout() {
                await supabase.auth.signOut();
            }

            async function handleAddStudent(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري الإضافة...' : '⏳ Adding...');
                const { error } = await supabase.from('students').insert([{
                    student_name: newStudent.name,
                    curriculum_system: newStudent.system,
                    grade_level: newStudent.grade,
                    hourly_rate: parseFloat(newStudent.rate),
                    parent_phone: newStudent.parent_phone.trim()
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم إضافة الطالب بنجاح!' : '✅ Student added successfully!');
                    fetchStudents();
                    setNewStudent({ name: '', system: '', grade: '', rate: '', parent_phone: '' });
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            async function handleAddSession(e) {
                e.preventDefault();
                setMsg(isArabic ? '⏳ جاري التسجيل...' : '⏳ Logging session...');
                const { error } = await supabase.from('sessions').insert([{
                    student_id: newSession.student_id,
                    duration_hours: parseFloat(newSession.duration)
                }]);
                
                if (!error) {
                    setMsg(isArabic ? '✅ تم تسجيل الحصة واعتماد التكلفة!' : '✅ Session logged and cost applied!');
                    setNewSession({ student_id: '', duration: '' });
                } else {
                    setMsg('❌ Error: ' + error.message);
                }
                setTimeout(() => setMsg(''), 4000);
            }

            if (!session) {
                return (
                    <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                        <button onClick={() => setIsArabic(!isArabic)} className="absolute top-6 left-6 px-6 py-2 glass-card rounded-full font-bold text-sm hover:bg-white/20 transition">
                            {isArabic ? 'English' : 'العربية'}
                        </button>
                        
                        <div className="glass-card p-10 rounded-3xl w-full max-w-md shadow-2xl">
                            <div className="text-center mb-8">
                                <div className="text-6xl mb-4">👨‍🏫</div>
                                <h2 className="text-3xl font-black">{isArabic ? 'لوحة الإدارة' : 'Admin Portal'}</h2>
                                <p className="text-blue-200 font-bold mt-2 text-sm">{isArabic ? 'أدخل بيانات الاعتماد للمتابعة' : 'Enter credentials to proceed'}</p>
                            </div>
                            
                            {loginError && <p className="bg-red-500/20 border border-red-500/50 text-red-100 p-3 rounded-xl mb-4 text-sm font-bold text-center">{loginError}</p>}
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <input type="email" placeholder={isArabic ? 'البريد الإلكتروني' : 'Email'} required className="w-full p-4 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={email} onChange={e => setEmail(e.target.value)} />
                                <input type="password" placeholder={isArabic ? 'كلمة المرور' : 'Password'} required className="w-full p-4 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={password} onChange={e => setPassword(e.target.value)} />
                                <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-orange-500/30">
                                    {isArabic ? 'تسجيل الدخول' : 'Login'}
                                </button>
                            </form>
                            
                            <div className="mt-6 text-center">
                                <a href="/" className="text-sm text-blue-300 hover:text-white underline decoration-blue-300 underline-offset-4">{isArabic ? 'العودة للصفحة الرئيسية' : 'Back to Home'}</a>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`p-4 md:p-8 max-w-6xl mx-auto ${isArabic ? 'font-cairo' : 'font-sans'}`} dir={isArabic ? 'rtl' : 'ltr'}>
                    <header className="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 gap-4 shadow-xl">
                        <div className="flex items-center gap-4">
                            <div className="w-16 h-16 bg-orange-500 rounded-full flex items-center justify-center text-3xl shadow-lg shadow-orange-500/50">🛡️</div>
                            <div>
                                <h1 className="text-2xl font-black text-white">{isArabic ? 'مركز الإدارة المركزية' : 'Central Admin Center'}</h1>
                                <p className="text-blue-200 font-bold text-sm">mr.gebally@gmail.com</p>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            <button onClick={() => setIsArabic(!isArabic)} className="px-5 py-2 glass-card hover:bg-white/20 rounded-xl font-bold text-sm transition">
                                {isArabic ? 'English' : 'العربية'}
                            </button>
                            <button onClick={handleLogout} className="px-5 py-2 bg-red-500/20 hover:bg-red-500/40 text-red-100 rounded-xl font-bold text-sm border border-red-500/50 transition">
                                {isArabic ? 'تسجيل خروج' : 'Logout'}
                            </button>
                        </div>
                    </header>

                    {msg && (
                        <div className={`mb-8 p-4 font-black rounded-xl border ${msg.includes('✅') ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-100' : 'bg-blue-500/20 border-blue-500/50 text-blue-100'} backdrop-blur-md`}>
                            {msg}
                        </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        {/* إضافة طالب */}
                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-blue-500`}></div>
                            <h3 className="text-2xl font-black mb-6 text-white">{isArabic ? '👤 إضافة طالب جديد' : '👤 Add New Student'}</h3>
                            <form onSubmit={handleAddStudent} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'اسم الطالب بالكامل' : 'Full Name'}</label>
                                    <input type="text" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} />
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'رقم هاتف ولي الأمر (للدخول والمتابعة)' : 'Parent Phone (For Login)'}</label>
                                    <input type="tel" required placeholder="010xxxxxxxx" className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.parent_phone} onChange={e => setNewStudent({...newStudent, parent_phone: e.target.value})} />
                                </div>
                                
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'النظام الدراسي' : 'Curriculum System'}</label>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.system} onChange={e => setNewStudent({...newStudent, system: e.target.value})}>
                                        <option value="" disabled>{isArabic ? '-- اختر النظام الدراسي --' : '-- Select System --'}</option>
                                        <option value="IGCSE">IGCSE (British)</option>
                                        <option value="IB">IB (International Baccalaureate)</option>
                                        <option value="American Diploma">American Diploma</option>
                                        <option value="National (Languages)">National (Languages / لغات)</option>
                                        <option value="National (Arabic)">National (Arabic / عربي)</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'المرحلة / الصف' : 'Grade Level'}</label>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.grade} onChange={e => setNewStudent({...newStudent, grade: e.target.value})}>
                                        <option value="" disabled>{isArabic ? '-- اختر المرحلة أو الصف --' : '-- Select Grade Level --'}</option>
                                        <option value="Grade 7 / Year 8">Grade 7 / Year 8</option>
                                        <option value="Grade 8 / Year 9">Grade 8 / Year 9</option>
                                        <option value="Grade 9 / Year 10">Grade 9 / Year 10</option>
                                        <option value="Grade 10 / Year 11">Grade 10 / Year 11</option>
                                        <option value="Grade 11 / Year 12">Grade 11 / Year 12</option>
                                        <option value="Grade 12 / Year 13">Grade 12 / Year 13</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'تكلفة الساعة (بالجنيه)' : 'Hourly Rate (EGP)'}</label>
                                    <input type="number" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-blue-400" value={newStudent.rate} onChange={e => setNewStudent({...newStudent, rate: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-blue-500/30 mt-4">
                                    {isArabic ? 'حفظ ملف الطالب' : 'Save Student'}
                                </button>
                            </form>
                        </div>

                        {/* تسجيل حصة */}
                        <div className="glass-card p-8 rounded-3xl relative overflow-hidden">
                            <div className={`absolute top-0 ${isArabic ? 'right-0' : 'left-0'} w-2 h-full bg-orange-500`}></div>
                            <h3 className="text-2xl font-black mb-6 text-white">{isArabic ? '⏱️ تسجيل وقت حصة' : '⏱️ Log Session Time'}</h3>
                            <form onSubmit={handleAddSession} className="space-y-4">
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'اختر الطالب' : 'Select Student'}</label>
                                    <select required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={newSession.student_id} onChange={e => setNewSession({...newSession, student_id: e.target.value})}>
                                        <option value="" disabled>{isArabic ? '-- اضغط لاختيار الطالب --' : '-- Select Student --'}</option>
                                        {students.map(s => <option key={s.id} value={s.id}>{s.student_name} ({s.curriculum_system} - {s.grade_level})</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="text-xs font-bold text-blue-200 block mb-1">{isArabic ? 'مدة الحصة بالساعات (مثال 1.5)' : 'Duration in hours (e.g., 1.5)'}</label>
                                    <input type="number" step="0.25" required className="w-full p-3 glass-input rounded-xl font-bold outline-none focus:border-orange-400" value={newSession.duration} onChange={e => setNewSession({...newSession, duration: e.target.value})} />
                                </div>
                                
                                <div className="p-4 bg-orange-500/10 border border-orange-500/30 rounded-xl mt-4">
                                    <p className="text-xs font-bold text-orange-200 leading-relaxed">
                                        {isArabic ? '💡 بمجرد التسجيل، سيتم حساب التكلفة وإضافتها لفاتورة الطالب تلقائياً.' : '💡 Upon logging, the cost will be calculated and added to the student\'s bill automatically.'}
                                    </p>
                                </div>

                                <button type="submit" className="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-xl transition shadow-lg shadow-orange-500/30 mt-4">
                                    {isArabic ? 'تسجيل الحصة واعتماد التكلفة' : 'Log Session & Apply Cost'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AdminPortal />);
    </script>
</body>
</html>
