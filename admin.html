<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Jebali Math Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        .font-cairo { font-family: 'Cairo', sans-serif; }
        
        /* حل مشكلة امتداد المحتوى وخروج الجداول عن إطار الموبايل */
        *, *::before, *::after { box-sizing: border-box; }
        html, body { max-width: 100%; overflow-x: hidden; }
        
        /* خلفية الإدارة */
        body { background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #111827 60%, #030712 100%); }
        .center-glow { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 650px; height: 650px; background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(37, 99, 235, 0.12) 45%, rgba(0,0,0,0) 70%); border-radius: 50%; pointer-events: none; z-index: 0; }

        .glass-card { background: rgba(30, 58, 95, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); max-width: 100%; word-wrap: break-word; }
        .glass-input { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: white; }
        
        /* حل مشكلة الجداول على الموبايل */
        .table-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="min-h-screen text-white font-cairo overflow-x-hidden relative selection:bg-orange-500 selection:text-white">

    <div class="center-glow"></div>

    <div class="relative z-10 p-4 md:p-8 max-w-6xl mx-auto">
        <!-- الهيدر -->
        <header class="flex flex-col md:flex-row justify-between items-center glass-card p-6 rounded-3xl mb-8 shadow-xl gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-tr from-orange-500 to-blue-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg">📐</div>
                <div>
                    <h1 class="text-2xl font-black">لوحة التحكم | Jebali Math Academy</h1>
                    <p class="text-blue-300 text-xs font-bold mt-1">نظام الإدارة الشامل</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2">
                <a href="index.html" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl font-bold text-xs transition flex items-center gap-1">🏠 الرئيسية (Home)</a>
                <button onclick="logoutAdmin()" class="px-4 py-2 bg-red-500/20 text-red-100 rounded-xl font-bold text-xs transition">خروج</button>
            </div>
        </header>

        <!-- الإحصائيات المالية السريعة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-6 rounded-3xl border border-emerald-500/30 text-center">
                <h3 class="text-xs text-emerald-300 font-bold mb-2 bg-emerald-500/20 inline-block px-3 py-1 rounded-lg">المبالغ المحصلة</h3>
                <div class="text-3xl font-black mt-2">0 <span class="text-lg text-slate-400">EGP</span></div>
            </div>
            <div class="glass-card p-6 rounded-3xl border border-orange-500/30 text-center">
                <h3 class="text-xs text-orange-300 font-bold mb-2 bg-orange-500/20 inline-block px-3 py-1 rounded-lg">المستحقات المعلقة</h3>
                <div class="text-3xl font-black mt-2">0 <span class="text-lg text-slate-400">EGP</span></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- نموذج توثيق الحصة -->
            <div class="glass-card p-6 rounded-3xl h-fit border border-blue-500/30">
                <h3 class="text-lg font-black mb-4 flex items-center gap-2"><span>📚</span> توثيق حصة</h3>
                
                <form id="sessionForm" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs text-blue-200 block mb-1">اختر الطالب:</label>
                            <select id="sessionStudentSelect" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="">-- تحميل الطلاب --</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-blue-200 block mb-1">النظام التعليمي:</label>
                            <select id="sessionSystemSelect" onchange="updateStrandsDropdown()" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                                <option value="IGCSE">IGCSE</option>
                                <option value="American Diploma">American Diploma</option>
                                <option value="IB">IB</option>
                                <option value="National (Egyptian)">National (Egyptian)</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="text-xs text-blue-200 block mb-1">التاريخ:</label>
                            <input type="date" id="sessionDate" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                        </div>
                        <div>
                            <label class="text-xs text-blue-200 block mb-1">وقت البدء:</label>
                            <input type="time" id="sessionStart" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                        </div>
                        <div>
                            <label class="text-xs text-blue-200 block mb-1">وقت الانتهاء:</label>
                            <input type="time" id="sessionEnd" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-blue-200 block mb-1">مكان انعقاد الحصة:</label>
                        <select id="sessionLocation" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                            <option value="Online (Zoom)">أونلاين (Zoom)</option>
                            <option value="Center">سنتر تعليمي (Center)</option>
                            <option value="Home">منزل الطالب (Home)</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-blue-200 block mb-1">🎯 المهارات الدولية أو المجال:</label>
                        <select id="sessionStrandSelect" required class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800">
                            <option value="">-- اختر المجال --</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-blue-200 block mb-1">عنوان الدرس / الموضوع:</label>
                        <input type="text" id="sessionTopicInput" required placeholder="مثال: Quadratic Functions" class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800" />
                    </div>

                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-3 rounded-xl transition shadow-lg text-sm">
                        وثّق الحصة
                    </button>
                </form>
            </div>

            <!-- إضافة طالب جديد -->
            <div class="glass-card p-6 rounded-3xl h-fit">
                <h3 class="text-lg font-black mb-4 flex items-center gap-2"><span>👤</span> إضافة طالب جديد</h3>
                
                <form id="addStudentForm" class="space-y-4">
                    <div>
                        <input type="text" id="addName" required placeholder="اسم الطالب الثلاثي" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="addPhone" required placeholder="رقم هاتف الطالب" class="w-full p-3 glass-input rounded-xl text-sm" />
                        <input type="text" id="addParentPhone" required placeholder="رقم هاتف ولي الأمر" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="addSystem" class="w-full p-3 glass-input rounded-xl text-sm bg-slate-800 text-white">
                            <option value="IGCSE">IGCSE</option>
                            <option value="American Diploma">American Diploma</option>
                            <option value="IB">IB</option>
                            <option value="National (Egyptian)">National (Egyptian)</option>
                        </select>
                        <input type="text" id="addGrade" required placeholder="الصف (مثال: Grade 10)" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="email" id="addEmail" placeholder="البريد الإلكتروني (اختياري)" class="w-full p-3 glass-input rounded-xl text-sm" />
                        <input type="text" id="addPass" required placeholder="كلمة المرور (للدخول)" class="w-full p-3 glass-input rounded-xl text-sm" />
                    </div>
                    
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 rounded-xl transition shadow-lg text-sm">
                        تسجيل الطالب الجديد
                    </button>
                </form>
            </div>

        </div>

        <!-- جدول الطلاب -->
        <div class="glass-card p-6 rounded-3xl mt-8">
            <h3 class="text-lg font-black mb-4 flex items-center gap-2"><span>📋</span> سجل الطلاب المسجلين</h3>
            <div class="table-container">
                <table class="w-full text-sm text-center">
                    <thead class="text-xs text-blue-200 uppercase bg-white/5 border-b border-white/10">
                        <tr>
                            <th class="py-3 px-4">Student Name</th>
                            <th class="py-3 px-4">System & Grade</th>
                            <th class="py-3 px-4">Credentials (Pass)</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <tr><td colspan="3" class="py-4 text-slate-400">جاري تحميل البيانات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        const supabaseUrl = 'https://vtzxfopaovhxefxhzxyb.supabase.co';
        const supabaseAnonKey = 'sb_publishable_lLPLnkxYBJRmD71FjfrEww_h4YL2-dK';
        const supabase = createClient(supabaseUrl, supabaseAnonKey);

        let studentsList = [];

        window.updateStrandsDropdown = function() {
            const system = document.getElementById('sessionSystemSelect').value;
            const strandSelect = document.getElementById('sessionStrandSelect');
            strandSelect.innerHTML = '<option value="">-- اختر المجال أو المهارة --</option>';
            
            let strands = [];
            if (system === 'IGCSE') {
                strands = ['Pure Mathematics 1 (P1)', 'Pure Mathematics 3 (P3)', 'Mechanics (M1)', 'Statistics (S1)'];
            } else if (system === 'American Diploma') {
                strands = ['Algebra 1 & 2', 'Pre-Calculus', 'Calculus AB/BC', 'Geometry & Statistics'];
            } else if (system === 'IB') {
                strands = ['Analysis and Approaches (AA)', 'Applications and Interpretation (AI)'];
            } else {
                strands = ['الجبر', 'التفاضل والتكامل', 'الهندسة الفراغية', 'الميكانيكا (استاتيكا / ديناميكا)'];
            }

            strands.forEach(strand => {
                const opt = document.createElement('option');
                opt.value = strand;
                opt.textContent = strand;
                strandSelect.appendChild(opt);
            });
        };

        window.addEventListener('DOMContentLoaded', async () => {
            updateStrandsDropdown();
            await fetchStudents();
            document.getElementById('sessionDate').valueAsDate = new Date();
        });

        async function fetchStudents() {
            const { data, error } = await supabase.from('students').select('*').order('created_at', { ascending: false });
            if (data) {
                studentsList = data;
                renderStudentsTable();
                populateStudentSelect();
            }
        }

        function populateStudentSelect() {
            const select = document.getElementById('sessionStudentSelect');
            select.innerHTML = '<option value="">-- اختر الطالب --</option>';
            studentsList.forEach(st => {
                const opt = document.createElement('option');
                opt.value = st.id;
                opt.textContent = st.student_name;
                select.appendChild(opt);
            });
        }

        function renderStudentsTable() {
            const tbody = document.getElementById('studentsTableBody');
            if (studentsList.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-slate-400">لا يوجد طلاب مسجلين بعد.</td></tr>';
                return;
            }
            tbody.innerHTML = studentsList.map(st => `
                <tr class="border-b border-white/5 hover:bg-white/5 transition">
                    <td class="py-3 px-4 font-bold">${st.student_name}</td>
                    <td class="py-3 px-4 text-xs">${st.curriculum_system}<br><span class="text-blue-300">${st.grade_level}</span></td>
                    <td class="py-3 px-4 text-xs text-orange-300 font-mono">${st.password || 'Not Set'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('addStudentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'جاري التسجيل...';

            const newStudent = {
                student_name: document.getElementById('addName').value,
                student_phone: document.getElementById('addPhone').value,
                parent_phone: document.getElementById('addParentPhone').value,
                curriculum_system: document.getElementById('addSystem').value,
                grade_level: document.getElementById('addGrade').value,
                email: document.getElementById('addEmail').value || null,
                password: document.getElementById('addPass').value,
                account_status: 'active'
            };

            const { error } = await supabase.from('students').insert([newStudent]);
            if (!error) {
                alert('✅ تم تسجيل الطالب بنجاح');
                e.target.reset();
                fetchStudents();
            } else {
                alert('❌ خطأ أثناء التسجيل: ' + error.message);
            }
            btn.innerText = originalText;
        });

        document.getElementById('sessionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'جاري التوثيق...';

            const studentId = document.getElementById('sessionStudentSelect').value;
            const topic = document.getElementById('sessionTopicInput').value;
            const strand = document.getElementById('sessionStrandSelect').value;
            const start = document.getElementById('sessionStart').value;
            const end = document.getElementById('sessionEnd').value;
            const date = document.getElementById('sessionDate').value;
            const sys = document.getElementById('sessionSystemSelect').value;

            // حساب المدة بالساعات
            const t1 = new Date(`${date}T${start}`);
            const t2 = new Date(`${date}T${end}`);
            let diffHrs = (t2 - t1) / (1000 * 60 * 60);
            if (diffHrs < 0) diffHrs += 24;
            diffHrs = Math.round(diffHrs * 100) / 100;

            const sessionData = {
                student_id: studentId,
                lesson_topic: `${date} | ${topic} (${sys})`,
                strand: strand,
                duration_hours: diffHrs,
                status: 'completed'
            };

            const { error } = await supabase.from('sessions').insert([sessionData]);
            if (!error) {
                alert('✅ تم توثيق الحصة بنجاح!');
                e.target.reset();
                document.getElementById('sessionDate').valueAsDate = new Date();
            } else {
                alert('❌ خطأ في توثيق الحصة: ' + error.message);
            }
            btn.innerText = originalText;
        });

        window.logoutAdmin = function() {
            window.location.href = 'index.html';
        };
    </script>
</body>
</html>
